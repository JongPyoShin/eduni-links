<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시장 리서치 아카이브</title>
<style>
:root{color-scheme:light;--ink:#18263d;--muted:#64748b;--line:#dbe4ef;--blue:#2757a5;--paper:#f5f7fb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(at 90% 0,#e5edff,transparent 35%),var(--paper);font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:var(--ink)}main{max-width:1050px;margin:auto;padding:32px 20px 72px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:5px 0;font-size:clamp(27px,5vw,43px);letter-spacing:-.04em}.lead{color:var(--muted);margin:8px 0 0}.panel{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 40px #263c6010;margin:16px 0}.row{display:flex;gap:10px;align-items:center}input,button{font:inherit;border-radius:11px;padding:12px 14px}input{border:1px solid var(--line);min-width:0;flex:1;color:var(--ink)}button{border:0;background:var(--blue);color:white;font-weight:750;cursor:pointer}button.secondary{background:#edf2fa;color:var(--ink)}button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}.toolbar{display:flex;gap:10px;margin-bottom:14px}.list{display:grid;gap:10px}.article{border:1px solid var(--line);border-radius:14px;padding:15px;display:grid;grid-template-columns:auto 1fr;gap:13px}.article input{flex:none;accent-color:var(--blue)}.meta{font-size:12px;color:var(--muted);font-weight:700}.article h3{margin:4px 0 7px;font-size:17px}.article p{margin:0;color:#4b5a70;font-size:14px;line-height:1.55}.article a,.source{color:var(--blue);font-weight:700;text-decoration:none}.article-actions{display:flex;gap:12px;margin-top:10px;font-size:13px}.metadata{background:#fff5df;color:#855600}.reader{white-space:pre-wrap;line-height:1.85;color:#334155;max-height:65vh;overflow:auto}.reader-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.close{padding:6px 10px}.answer{white-space:pre-wrap;line-height:1.75}.status{color:var(--muted);font-size:13px;margin-top:10px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.badge{display:inline-block;background:#edf3ff;color:#234f9a;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750}h2{font-size:18px;margin:0 0 14px}@media(max-width:600px){main{padding:20px 12px 48px}.panel{padding:16px}.row{align-items:stretch}.toolbar{flex-direction:column}header{align-items:flex-start}}
.privacy-note{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.5}</style></head>
<body><main>
<header><div><div class="eyebrow">NAVER PREMIUM · 세상의 모든 시장 이야기</div><h1>시장 리서치 아카이브</h1><p class="lead">저장된 글을 검색하고, 글을 선택하면 해당 글만 참고하고, 선택하지 않으면 관련 글을 자동으로 찾습니다.</p><p class="privacy-note">질문 시 관련 글 최대 4개의 본문 발췌(각 350자)와 제목·날짜만 AI에 전달합니다. 원문 전체는 AI로 보내지 않습니다.</p></div></header>
<section id="archive">
<div class="panel"><div class="toolbar"><input id="query" maxlength="160" placeholder="제목과 본문 검색"><button id="search">검색</button></div><div id="results" class="list"></div><div class="pager"><button id="prev" class="secondary">이전</button><span id="count" class="meta"></span><button id="next" class="secondary">다음</button></div></div>
<div id="reader" class="panel hidden"><div class="reader-head"><div><h2 id="readerTitle"></h2><div id="readerMeta" class="meta"></div></div><button id="closeReader" type="button" class="secondary close">닫기</button></div><p id="readerNotice" class="status"></p><div id="readerSwitch" class="hidden" style="display:flex;gap:8px;margin:14px 0"><button id="readerOriginalView" type="button" aria-pressed="true">원문형 보기</button><button id="readerTextView" type="button" class="secondary" aria-pressed="false">텍스트 보기</button></div><iframe id="readerOriginal" class="hidden" title="원문형 글과 이미지" sandbox="" referrerpolicy="strict-origin-when-cross-origin" loading="lazy" style="width:100%;height:min(78vh,1000px);border:1px solid #dbe4ef;border-radius:12px;background:#f2f4f7"></iframe><p id="readerText" class="reader"></p><a id="readerSource" class="source" target="_blank" rel="noopener noreferrer">네이버 프리미엄 원문 열기 ↗</a></div>
<div class="panel"><h2>질문할 글 선택 (선택 사항) <span id="selectedCount" class="badge">0 / 4</span></h2><form id="askForm"><div class="row"><input id="question" maxlength="180" placeholder="예: 저자가 보는 주요 위험 요인은 무엇인가요?" required><button>질문</button></div></form><div id="answer" class="answer" style="margin-top:16px"></div><div id="answerSources" class="article-actions"></div><div id="askStatus" class="status"></div></div>
</section></main>
<script>
const $=s=>document.querySelector(s);let page=1,total=0,selected=new Set(),lastArticles=[];
async function api(url,opts={}){return fetch(url,{credentials:'same-origin',cache:'no-store',...opts})}
async function load(){const q=$('#query').value.trim();const r=await api(`/portal/market/api/articles?q=${encodeURIComponent(q)}&page=${page}`);const d=await r.json();if(!d.ok)return;total=d.total;$('#count').textContent=`${total.toLocaleString()}건 · ${page}페이지`;$('#prev').disabled=page<=1;$('#next').disabled=page*30>=total;$('#results').innerHTML=d.articles.map(a=>`<div class="article"><input type="checkbox" aria-label="AI 답변에 포함할 글 ${esc(a.title)}" data-id="${esc(a.id)}" ${selected.has(a.id)?'checked':''} ${a.has_content?'':'disabled'}><span><span class="meta">${esc(a.date)} · ${esc(a.category||'시장 분석')} ${a.has_content?'':'<span class="badge metadata">본문 미수집</span>'} ${a.has_video?'<span class="badge metadata">영상 포함</span>':''}</span><h3>${esc(a.title)}</h3><p>${esc(a.excerpt||'저장된 본문 발췌가 없습니다.')}</p><span class="article-actions"><button type="button" class="secondary read-button" data-id="${esc(a.id)}">${a.has_content?'본문 읽기':'보관 메타데이터 보기'}</button><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">네이버 원문 ↗</a></span></span></div>`).join('')||'<p class="status">검색 결과가 없습니다.</p>';$('#results').querySelectorAll('input[type=checkbox]').forEach(el=>el.onchange=()=>{if(el.checked&&selected.size>=4){el.checked=false;return}el.checked?selected.add(el.dataset.id):selected.delete(el.dataset.id);$('#selectedCount').textContent=`${selected.size} / 4`});$('#results').querySelectorAll('.read-button').forEach(el=>el.onclick=()=>readArticle(el.dataset.id))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setReaderView(showOriginal){$('#readerOriginal').classList.toggle('hidden',!showOriginal);$('#readerText').classList.toggle('hidden',showOriginal);$('#readerOriginalView').setAttribute('aria-pressed',String(showOriginal));$('#readerTextView').setAttribute('aria-pressed',String(!showOriginal))}
$('#readerOriginalView').onclick=()=>setReaderView(true);$('#readerTextView').onclick=()=>setReaderView(false);
async function readArticle(id){const r=await api(`/portal/market/api/articles/${encodeURIComponent(id)}`);const d=await r.json();if(!d.ok)return;const a=d.article;const hasOriginal=Boolean(a.html&&a.has_content);$('#readerTitle').textContent=a.title;$('#readerMeta').textContent=`${a.date} · ${a.category||'시장 분석'}`;const mediaCount=Number(a.media_count||0),storedMediaCount=Number(a.stored_media_count||0);$('#readerNotice').textContent=a.has_content?(mediaCount?`원문형 글 · 이미지 ${mediaCount.toLocaleString()}개 · ${storedMediaCount.toLocaleString()}개는 PostgreSQL 보관본에서 불러옵니다${storedMediaCount<mediaCount?`, ${mediaCount-storedMediaCount}개는 원문 주소로 표시합니다`:''}.`:(a.has_video?'저장된 본문 · 원문에 영상 포함':'저장된 원문형 글')):(a.has_video?'본문과 영상 자막이 수집되지 않은 영상 기록입니다.':'본문이 수집되지 않은 미디어 전용 기록입니다.');$('#readerText').textContent=a.text||'저장된 본문 텍스트가 없습니다.';$('#readerOriginal').srcdoc=hasOriginal?a.html:'';$('#readerSwitch').classList.toggle('hidden',!hasOriginal);setReaderView(hasOriginal);$('#readerSource').href=a.url;$('#reader').classList.remove('hidden');$('#reader').scrollIntoView({behavior:'smooth',block:'start'})}
$('#closeReader').onclick=()=>$('#reader').classList.add('hidden');
$('#search').onclick=()=>{page=1;load()};$('#query').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();page=1;load()}};$('#prev').onclick=()=>{page=Math.max(1,page-1);load()};$('#next').onclick=()=>{page++;load()};
$('#askForm').onsubmit=async e=>{e.preventDefault();$('#askStatus').textContent='관련 글을 찾아 읽고 있습니다…';$('#answer').textContent='';$('#answerSources').replaceChildren();try{const r=await api('/portal/market/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('#question').value.trim(),article_ids:[...selected]})});const d=await r.json();if(!r.ok){$('#askStatus').textContent=r.status===403?'질문 요청을 확인하지 못했습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요.':d.error==='ai_unavailable'?'AI 연결이 일시적으로 되지 않습니다. 잠시 후 다시 시도해 주세요.':d.error==='busy'?'질문 요청이 많습니다. 잠시 후 다시 시도해 주세요.':d.error==='no_sources'?'본문이 저장된 글을 찾지 못했습니다. 글을 선택하거나 주제를 짧게 입력해 주세요.':'답변을 만들지 못했습니다. 잠시 후 다시 시도해 주세요.';return}$('#answer').textContent=d.answer;for(const source of d.sources){const link=document.createElement('a');link.className='source';link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=`[${source.id}] ${source.date} · ${source.title} ↗`;$('#answerSources').append(link)}$('#askStatus').textContent=d.source_mode==='selected'?'선택한 글을 참고한 답변입니다.':d.source_mode==='recent'?'일치하는 글을 찾지 못해 최근 저장 글을 참고했습니다.':'아카이브에서 관련 글을 찾아 답변했습니다.'}catch{$('#askStatus').textContent='AI 연결 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.'}};
load();
</script></body></html>
