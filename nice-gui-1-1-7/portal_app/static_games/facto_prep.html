</style></head><body><div class="w"><header class="hero"><div class="ey">EDUNI · 팩토 실전 모의시험</div><h1>팩토대회준비</h1><p>실제 시험지처럼 그림·도식·식 쓰기 문제를 섞었습니다. 20문제씩 10회 모의시험입니다.</p><div class="meta"><span class="pill">총 200문제</span><span class="pill">20문제 × 10시험</span><span class="pill">답안·채점결과 자동 저장</span></div></header><section id="list"><div id="grid" class="grid"></div></section><section id="view" class="hide"><div class="bar"><div><b id="et"></b><div id="ep" style="font-size:12px;color:#667085;font-weight:800"></div></div><button class="btn soft" onclick="goList()">시험 목록</button></div><div id="score"></div><main id="sheet" class="paper"></main></section></div><div id="bot" class="bottom"><button class="btn soft" onclick="goList()">시험 목록</button><button class="btn red" onclick="resetExam()">초기화</button><button id="grade" class="btn dark" onclick="gradeExam()">채점하기</button></div><script>
const Q=[];let id=1;const K=['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'],T=['','열','스물','서른','마흔','쉰'];const kor=n=>n<10?K[n]:T[Math.floor(n/10)]+K[n%10];function add(kind,answer,title,visual,options,mode='base',family='',extra={}){Q.push({id,exam:((id-1)%10)+1,mode,family,kind,answer:String(answer),title,visual,...(options?{options:options.map(String)}:{}),...extra});id++}

for(let i=0;i<10;i++){let c=33+i*3,u=1+i%2,l=1+(i+1)%2,r=1+i%2,d=1+(i+1)%2;add('text',`${c-10*u},${c-l},${c+r},${c+10*d}`,`${c}에서 화살표 방향으로 이동한 곳의 수를 차례로 쓰세요.`,'',null,'base','100수표',{center:c,u,l,r,d})}
for(let i=0;i<10;i++){let a=15+i%6,b=2+i%7;if(b>=a)b=3;add('text',a-b,'수직선에서 이동한 뒤 답을 쓰세요.','',null,'base','뺄셈수직선',{a,b})}
for(let i=0;i<10;i++){let a=10+i,b=12+i%5,da=2+i%5,db=3+(i*2)%5,ta=a+da,tb=b+db,ans=ta>tb?'지아':tb>ta?'민아':'같다';add('equation',`${a}+${da}=${ta}|${b}+${db}=${tb}|${ans}`,`지아는 ${a}개, 민아는 ${b}개를 가지고 있습니다. 지아가 ${da}개, 민아가 ${db}개를 더 받았습니다. 누가 더 많을까요?`,'',null,'base','문장제',{kids:[['지아',a,da],['민아',b,db]],final:ans})}
for(let i=0;i<10;i++){let n=13+i;add('choice',n%2?'홀수':'짝수',`그림의 물건을 세어 짝수인지 홀수인지 고르세요.`,'',['짝수','홀수'],'base','개수짝홀',{n,icon:i%2?'🍊':'●'})}
for(let i=0;i<5;i++){let a=[14+i,22+i*2,31-i,39+i,18+i,27+i],s=[...a].sort((x,y)=>y-x);add('text',s.join(','),'큰 수부터 순서대로 써 보세요.',a.join(' · '),null,'variant','혼합내림차순',{nums:a})}
for(let i=0;i<5;i++){let lo=8+i*2,hi=lo+10,p=i%2,v=[];for(let n=lo+1;n<hi;n++)if(n%2===p)v.push(n);add('multi',v.join(','),'두 조건에 모두 맞는 수를 고르세요.','',[...Array(hi-lo+3)].map((_,j)=>lo-1+j),'variant','범위짝홀',{bubbles:[`${lo}보다 커.`,`${hi}보다 작아.`,p?'홀수야.':'짝수야.']})}
for(let i=0;i<5;i++){let f=1+i%2,t=1+i,o=2+i;add('text',50*f+10*t+o,'세 종류의 동전을 모두 합한 금액을 쓰세요.','',null,'variant','혼합동전',{coins:{50:f,10:t,1:o}})}
for(let i=0;i<5;i++){let s=3+i,step=2+i%3,arr=[...Array(6)].map((_,j)=>s+j*step),seq=arr.map((n,j)=>[1,4].includes(j)?'□':n);add('text',`${arr[1]},${arr[4]}`,'규칙을 찾아 빈칸 두 곳의 수를 왼쪽부터 쓰세요.',seq.join(' → '),null,'variant','규칙빈칸2',{seq})}
for(let i=0;i<5;i++){let c=45+i*4,u=1+i%2,r=2;add('text',`${c-10*u},${c+r},${c-10*u+r}`,`${c}에서 위쪽, 오른쪽, 꺾어서 이동한 곳의 수를 차례로 쓰세요.`,'',null,'variant','복합100수표',{center:c,u,l:0,r,d:0})}

for(let i=0;i<5;i++){let a=12+i,b=9+i,da=4+i%2,db=5+(i+1)%2,ta=a+da,tb=b+db,ans=ta>tb?'지아':tb>ta?'민아':'같다';add('equation',`${a}+${da}=${ta}|${b}+${db}=${tb}|${ans}`,`지아는 ${a}개, 민아는 ${b}개입니다. 각각 ${da}개와 ${db}개를 더 받았습니다. 식을 쓰고 비교하세요.`,'',null,'variant','문장제변형',{kids:[['지아',a,da],['민아',b,db]],final:ans})}

for(let i=0;i<5;i++){let base=(2+i)*10+(7-i);add('text',`${base-1},${base+1}`,'바로 앞의 수와 바로 뒤의 수를 차례로 쓰세요.',`□ ← ${base} → □`,null,'variant','이웃수')}
const KEY='facto-prep-v3';let cur=null,S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{S={}}const state=n=>S[n]||(S[n]={answers:{},graded:false,score:null,results:{}});const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=v=>String(v??'').trim().replace(/\s+/g,'').replace(/[，]/g,',');const csv=v=>norm(v).split(',').filter(Boolean).sort((a,b)=>+a-+b).join(',');function shuffled(items,seed){let a=[...items],x=seed>>>0||1;for(let i=a.length-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;let j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}const examQuestions=n=>shuffled(Q.filter(q=>q.exam===n),7300+n*97);
function visual(q){if(q.coins){let h='<div class="coinrow">';for(let val of [50,10,1])for(let i=0;i<(q.coins[val]||0);i++)h+=`<span class="coin ${val===50?'c50':''}">${val}원</span>`;return h+'</div>'}if(q.bundles!=null){return `<div class="bundles">${'<span class="bundle"></span>'.repeat(q.bundles)}${'<span class="dot"></span>'.repeat(q.singles)}</div>`}if(q.family==='자리수카드')return `<div class="cards"><b>십의 자리</b>${q.tens.map(x=>`<span class="numcard">${x}</span>`).join('')}<b>일의 자리</b>${q.ones.map(x=>`<span class="numcard pink">${x}</span>`).join('')}</div>`;if(q.bubbles)return `<div class="bubblewrap">${q.bubbles.map(x=>`<span class="bubble">${esc(x)}</span>`).join('')}</div>`;if(q.family.includes('100수표')){let c=q.center,rows='';for(let dr=-2;dr<=2;dr++){rows+='<tr>';for(let dc=-2;dc<=2;dc++){let n=c+dr*10+dc,cl=dr===0&&dc===0?'c':(Math.abs(dr)<=q.u&&dc===0)||(dr===0&&Math.abs(dc)<=Math.max(q.l||0,q.r||0))?'a':'';rows+=`<td class="${cl}">${n}</td>`}rows+='</tr>'}return `<table class="hundred">${rows}</table><div class="hintfree">노란 칸에서 문제의 방향만큼 이동해 보세요.</div>`}if(q.family==='뺄셈수직선'){let lo=Math.max(0,q.a-q.b-2),hi=q.a+1,h='<div class="numberline">';for(let n=lo;n<=hi;n++)h+=`<div class="tick"><b>${n}</b></div>`;return h+'</div><div class="hintfree">'+q.a+'에서 왼쪽으로 '+q.b+'칸 이동합니다.</div>'}if(q.family==='개수짝홀')return `<div class="objrow">${Array(q.n).fill(`<span class="obj">${q.icon}</span>`).join('')}</div>`;if(q.kids)return `<div class="kidscene">${q.kids.map(k=>`<div class="kid"><span class="face">🙂</span><strong>${k[0]}</strong>처음 ${k[1]}개<br>더 받은 것 ${k[2]}개</div>`).join('')}</div><div class="hintfree">계산식은 스스로 만들어 아래에 쓰세요.</div>`;if(q.seq)return `<div class="train">${q.seq.map((x,i)=>`${i?'<b class="arr">→</b>':''}<span>${x}</span>`).join('')}</div>`;if(q.nums)return `<div class="cards">${shuffled(q.nums,q.id*31).map((x,i)=>`<span class="numcard ${i%2?'pink':''}">${x}</span>`).join('')}</div>`;if(q.visual)return `<div class="note">${esc(q.visual)}</div>`;return ''}
function answerHtml(q,st){let v=st.answers[q.id];if(q.kind==='text')return `<input class="txt" data-id="${q.id}" value="${esc(v??'')}" placeholder="답">`;if(q.kind==='equation'){let a=Array.isArray(v)?v:['','',''];return `<div class="eqgrid"><b>식 ①</b><input data-id="${q.id}" data-part="0" value="${esc(a[0]||'')}" placeholder="식을 쓰세요"><b>식 ②</b><input data-id="${q.id}" data-part="1" value="${esc(a[1]||'')}" placeholder="식을 쓰세요"><b>답</b><input data-id="${q.id}" data-part="2" value="${esc(a[2]||'')}" placeholder="이름 또는 같다"></div>`}let typ=q.kind==='multi'?'checkbox':'radio',vals=Array.isArray(v)?v:[v];return `<div class="choices">${shuffled(q.options,q.id*193+41).map((x,i)=>`<div class="ch"><input data-id="${q.id}" id="q${q.id}_${i}" name="q${q.id}" type="${typ}" value="${esc(x)}" ${vals.includes(String(x))?'checked':''}><label for="q${q.id}_${i}">${esc(x)}</label></div>`).join('')}</div>`}
function qhtml(q,no,st){return `<section class="q" data-q="${q.id}"><div class="qh"><div class="no">${no}</div><div><div class="ttl">${esc(q.title)}</div><div class="fam">${q.mode==='base'?'기본 유형':'변형 유형'}</div></div></div><div class="visual">${visual(q)}</div><div class="ans">${answerHtml(q,st)}</div><div class="res"></div></section>`}
function list(){let g=document.getElementById('grid');g.innerHTML='';for(let n=1;n<=10;n++){let st=state(n),a=Object.values(st.answers).filter(v=>Array.isArray(v)?v.some(norm):norm(v)).length,cl=st.graded?'done':a?'prog':'',tx=st.graded?`채점완료 · ${st.score}/20`:a?`진행중 · ${a}/20`:'미응시';g.innerHTML+=`<button class="card ${cl}" onclick="openExam(${n})"><b>실전 모의시험 ${n}</b><small>20문제 · 그림/도식/식 쓰기 혼합</small><span class="st">${tx}</span></button>`}}
function openExam(n){cur=n;document.getElementById('list').classList.add('hide');document.getElementById('view').classList.remove('hide');document.getElementById('bot').classList.add('on');render();scrollTo(0,0)}function goList(){cur=null;document.getElementById('view').classList.add('hide');document.getElementById('bot').classList.remove('on');document.getElementById('list').classList.remove('hide');list();scrollTo(0,0)}
function capture(e,st){let k=e.dataset.id,q=Q.find(x=>x.id==k);if(q.kind==='equation'){let a=Array.isArray(st.answers[k])?st.answers[k]:['','',''];a[+e.dataset.part]=e.value;st.answers[k]=a}else if(e.type==='checkbox')st.answers[k]=[...document.querySelectorAll(`input[data-id="${k}"]:checked`)].map(x=>x.value);else if(e.type==='radio'){let c=document.querySelector(`input[data-id="${k}"]:checked`);st.answers[k]=c?c.value:''}else st.answers[k]=e.value;save();let a=Object.values(st.answers).filter(v=>Array.isArray(v)?v.some(norm):norm(v)).length;document.getElementById('ep').textContent=`${a}/20 풀이`}
function render(){let st=state(cur),qs=examQuestions(cur),a=Object.values(st.answers).filter(v=>Array.isArray(v)?v.some(norm):norm(v)).length;document.getElementById('et').textContent=`실전 모의시험 ${cur} · 20문제`;document.getElementById('ep').textContent=st.graded?`채점완료 · ${st.score}/20`:`${a}/20 풀이`;document.getElementById('grade').disabled=st.graded;document.getElementById('grade').textContent=st.graded?'채점완료':'채점하기';document.getElementById('score').innerHTML=st.graded?`<div class="score">모의시험 ${cur} 결과: ${st.score}/20 · 초기화 전까지 저장됩니다.</div>`:'';document.getElementById('sheet').innerHTML=`<div class="testhead"><div class="testrow"><div class="testtitle">팩토 실전 모의시험 ${cur}</div><div class="namebox">이름 <span></span></div></div></div>`+qs.map((q,i)=>qhtml(q,i+1,st)).join('');document.querySelectorAll('#sheet input').forEach(e=>e.addEventListener(e.type==='text'?'input':'change',()=>capture(e,st)));if(st.graded){document.querySelectorAll('#sheet input').forEach(e=>e.disabled=true);results(st)}}
function correct(q,v){if(q.kind==='multi'){let got=(Array.isArray(v)?v:[]).map(String).sort((a,b)=>+a-+b).join(',');return got===csv(q.answer)}if(q.kind==='equation'){let ex=q.answer.split('|'),got=Array.isArray(v)?v:['','',''];return norm(got[0])===norm(ex[0])&&norm(got[1])===norm(ex[1])&&norm(got[2])===norm(ex[2])}return norm(v)===norm(q.answer)}function gradeExam(){let st=state(cur),sc=0;st.results={};for(let q of examQuestions(cur)){let ok=correct(q,st.answers[q.id]);st.results[q.id]=ok;if(ok)sc++}st.score=sc;st.graded=true;save();render();scrollTo(0,0)}function results(st){for(let q of examQuestions(cur)){let r=document.querySelector(`[data-q="${q.id}"] .res`),ok=!!st.results[q.id];r.className=`res ${ok?'ok':'bad'}`;r.textContent=ok?'정답이에요! ✓':`오답 · 정답: ${q.answer.replace(/\|/g,' / ')}`}}
function resetExam(){if(!confirm(`모의시험 ${cur}의 답안과 채점 결과를 모두 초기화할까요?`))return;S[cur]={answers:{},graded:false,score:null,results:{}};save();render()}function validate(){let e=[];if(Q.length!==200)e.push('count');if(new Set(Q.map(q=>q.id)).size!==200)e.push('id');if(Q.filter(q=>q.mode==='base').length!==150)e.push('base');if(Q.filter(q=>q.mode==='variant').length!==50)e.push('variant');for(let n=1;n<=10;n++)if(Q.filter(q=>q.exam===n).length!==20)e.push('exam'+n);for(let q of Q){if(!q.answer)e.push('answer'+q.id);if(q.kind==='choice'&&!q.options.includes(q.answer))e.push('choice'+q.id);if(q.kind==='multi'&&q.answer.split(',').some(x=>!q.options.includes(x)))e.push('multi'+q.id)}if(e.length){console.error(e);alert('팩토 문제은행 검증 오류: '+e.join(','))}else console.info('FACTO OK: 200, base150, variant50, 10x20')}validate();list();
</script></body></html>
