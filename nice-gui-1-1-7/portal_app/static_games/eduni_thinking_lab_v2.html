<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>생각 탐험 연구소 · 체험실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#163a35;font:17px/1.65 system-ui,"Malgun Gothic",sans-serif}main{max-width:760px;margin:auto;padding:18px 16px 48px}a{color:#16675e}h1{font-size:clamp(25px,6vw,36px);line-height:1.25;margin:12px 0}h2{font-size:23px;line-height:1.35;margin:0}h3{font-size:18px;margin:0}p{margin:8px 0 16px}.panel{background:white;border:1px solid #d4e5de;border-radius:20px;padding:18px;margin:14px 0}.menu,.controls{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;font-weight:650;min-height:48px;border:1px solid #8daea4;background:#fff;color:#164d45;padding:9px 14px;border-radius:12px;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #bf7100;outline-offset:3px}button[aria-pressed=true],button.primary{background:#17685d;color:white;border-color:#17685d}button:disabled{opacity:.45;cursor:default}.animal{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border-bottom:1px solid #e0ebe6;padding:12px 0}.animal strong{font-size:19px}.apples{overflow-wrap:anywhere}.small{font-size:14px;color:#4a665e}.status{background:#e9f4ee;padding:12px;border-radius:12px;margin:12px 0;min-height:50px}.grid{display:grid;gap:4px;max-width:420px;margin:12px auto}.cell{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;background:#e2efe5;font-size:clamp(15px,5vw,27px);border:1px solid #a8cabb}.wall{background:#bac3c1}.trail{background:#fbdc9c}.clue{padding:12px;border:1px solid #d6e5dd;border-radius:12px;margin:10px 0}.clue button,.choice{width:100%;text-align:left}.seq{min-height:48px;overflow-wrap:anywhere;padding:10px;background:#f1f5f3;border-radius:10px}label{display:block;margin:10px 0}input[type=checkbox]{width:22px;height:22px;vertical-align:middle;margin-right:8px}details{margin-top:16px}summary{cursor:pointer;font-weight:650}.tag{font-size:14px;color:#4b6860} .level{margin:8px 0} @media(max-width:380px){.panel{padding:12px}button{padding:8px 10px}}
</style></head><body><main><a href="/portal/thinking">← 생각 탐험 연구소로 돌아가기</a><h1>생각 탐험 체험실</h1><p>단서를 찾아보고, 네 방법으로 해결해 봐요. 처음부터 성공하지 않아도 괜찮아요.</p><nav class="menu" id="menu" aria-label="탐험 고르기"></nav><section class="panel" id="game"></section><p class="small">체험판에서는 진행 기록을 저장하지 않아요. 기존 연구소의 학습 기록은 그대로 유지돼요.</p></main>
<script id="rules">
const DATA={"food":[{"title":"숲속 친구들의 점심","intro":"토끼, 곰, 원숭이가 점심을 기다려요. 친구마다 필요한 사과의 수가 달라요.","names":["토끼","곰","원숭이"],"emoji":["🐰","🐻","🐵"],"need":[2,6,4],"stock":12,"reserve":0},{"title":"다람쥐 가족의 간식","intro":"세 친구에게 사과를 나눠 주고, 남은 사과는 바구니에 두어요.","names":["다람쥐","여우","고슴도치"],"emoji":["🐿️","🦊","🦔"],"need":[3,5,2],"stock":11,"reserve":0},{"title":"늦게 오는 친구","intro":"세 친구에게 필요한 만큼 나눠 주되, 늦게 오는 친구를 위해 사과 2개 이상을 남겨 두어요.","names":["토끼","곰","여우"],"emoji":["🐰","🐻","🦊"],"need":[3,5,4],"stock":15,"reserve":2}],"route":[{"title":"꽃밭에 도착하기","intro":"로봇이 꽃밭에 물을 주러 가요. 돌을 피해 꽃까지 가는 길을 만들어 주세요.","w":4,"h":4,"start":[0,3],"goal":[3,0],"walls":[[1,2],[2,2]],"limit":8},{"title":"연못을 돌아가는 길","intro":"이번에는 연못이 길을 막고 있어요. 로봇이 지나갈 수 있는 칸을 찾아보세요.","w":5,"h":4,"start":[0,3],"goal":[4,0],"walls":[[1,1],[1,2],[2,2],[3,2]],"limit":9},{"title":"배터리가 얼마 남지 않았어요","intro":"로봇이 움직일 수 있는 횟수가 줄었어요. 돌을 피하면서 꽃까지 짧은 길을 만들어 주세요.","w":5,"h":5,"start":[0,4],"goal":[4,0],"walls":[[1,4],[1,3],[2,2],[3,1],[3,2]],"limit":8}],"detect":[{"title":"젖은 책상","intro":"교실 책상 위에 물이 고여 있어요. 어디에서 물이 나왔을까요? 단서를 조사해 가장 근거가 많은 설명을 찾아보세요.","clues":[["물병","물병 뚜껑이 열려 있고 옆으로 누워 있어요."],["창문","창문은 닫혀 있고 창틀은 말라 있어요."],["물자국","물병 입구에서 물웅덩이까지 젖은 자국이 이어져요."],["시계","시계는 세 시를 가리키고 있어요."]],"ideas":["열린 물병에서 물이 흘렀을 가능성이 커요.","창문으로 빗물이 들어왔을 가능성이 커요.","시계에서 물이 나왔을 가능성이 커요."],"correct":0,"proof":[0,2],"hint":"물의 출발점과 이어지는 자국을 찾아보세요.","why":"열린 물병과 이어진 물자국은 물병에서 물이 흘렀다는 설명을 뒷받침해요. 누가 물병을 넘어뜨렸는지는 아직 알 수 없어요."},{"title":"사라진 종이비행기","intro":"책상에 있던 종이비행기가 보이지 않아요. 교실의 단서를 확인해 어디에서 찾아보면 좋을지 생각해 보세요.","clues":[["선풍기","책상 옆 선풍기가 열린 문 쪽을 향해 돌아가고 있어요."],["창문","창문은 닫혀 있어요."],["복도","문 밖 바닥에 같은 색과 모양의 종이비행기가 보여요."],["가방","가방은 의자에 걸려 있어요."]],"ideas":["창문 밖부터 찾아봐요.","복도에 있는 비행기부터 확인해요.","가방 안부터 찾아봐요."],"correct":1,"proof":[0,2],"hint":"종이비행기가 이동할 수 있는 방향과 실제로 발견된 물건을 살펴보세요.","why":"바람이 문 쪽으로 불고 복도에 비슷한 비행기가 보여요. 복도에서 먼저 확인할 이유가 있어요. 그 비행기가 정말 내 것인지는 확인해야 해요."},{"title":"시들어 가는 화분","intro":"교실 화분의 잎이 축 늘어졌어요. 지금 관찰할 수 있는 단서로 먼저 무엇을 확인하면 좋을까요?","clues":[["흙","흙 표면이 말라 있고 손으로 만져 보니 속도 건조해요."],["물주기 기록","지난 며칠 동안 물을 준 기록이 없어요."],["창가","화분은 밝은 창가에 있어요."],["화분 색","화분은 파란색이에요."]],"ideas":["화분 색을 바꾸면 바로 회복할 거예요.","빛이 부족하다고 단정해요.","물이 부족한지 먼저 살펴보고 알맞게 물을 줘요."],"correct":2,"proof":[0,1],"hint":"화분 색보다 식물이 자라는 데 필요한 조건을 살펴보세요.","why":"마른 흙과 물주기 기록은 물 부족을 먼저 확인할 근거가 돼요. 식물에 맞는 양의 물을 주고 이후 변화를 관찰해야 원인을 더 잘 알 수 있어요."}]};
function foodResult(s,a){const valid=Array.isArray(a)&&a.length===s.need.length&&a.every(x=>Number.isInteger(x)&&x>=0);if(!valid)return {ok:false};const left=s.stock-a.reduce((x,y)=>x+y,0);const short=s.need.map((n,i)=>Math.max(0,n-a[i]));return {ok:left>=s.reserve&&short.every(x=>x===0),left,short};}
function runRoute(s,cmds){let p=s.start.slice(),path=[p.slice()];const d={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};if(cmds.length>s.limit)return {ok:false,path,reason:"limit"};for(let i=0;i<cmds.length;i++){let v=d[cmds[i]];if(!v)return {ok:false,path,reason:"command",at:i};let n=[p[0]+v[0],p[1]+v[1]];if(n[0]<0||n[1]<0||n[0]>=s.w||n[1]>=s.h||s.walls.some(w=>w[0]===n[0]&&w[1]===n[1]))return {ok:false,path,reason:"wall",at:i};p=n;path.push(p.slice());}return {ok:p[0]===s.goal[0]&&p[1]===s.goal[1],path,reason:"end"};}
function detectiveResult(s,idea,seen,proof){const ready=seen.length===s.clues.length&&idea!==null&&proof.length>=2;return {ready,ok:ready&&idea===s.correct&&s.proof.every(i=>proof.includes(i))&&proof.every(i=>seen.includes(i))};}
</script>
<script>
"use strict";
const menu=document.getElementById("menu"), game=document.getElementById("game");
const labels={food:"🍎 사과 나누기",route:"🤖 로봇 길 만들기",detect:"🔎 단서 탐정"};
const dirs={U:"↑",D:"↓",L:"←",R:"→"}, dirNames={U:"위",D:"아래",L:"왼쪽",R:"오른쪽"};
let mode="food",level=0,state;
function node(tag,value,cls){const el=document.createElement(tag);if(value!==undefined)el.textContent=value;if(cls)el.className=cls;return el;}
function button(parent,label,fn,opts={}){const b=node("button",label,opts.primary?"primary":"");b.type="button";if(opts.pressed!==undefined)b.setAttribute("aria-pressed",String(opts.pressed));if(opts.label)b.setAttribute("aria-label",opts.label);b.disabled=!!opts.disabled;b.addEventListener("click",fn);parent.append(b);return b;}
function start(m,l){mode=m;level=l;state={a:[0,0,0],cmds:[],seen:[],proof:[],idea:null,result:null,attempted:false};render();}
function render(){menu.replaceChildren();for(const key of Object.keys(labels))button(menu,labels[key],()=>start(key,0),{pressed:key===mode});game.replaceChildren();const s=DATA[mode][level];game.append(node("div","탐험 "+(level+1)+" / "+DATA[mode].length,"tag"),node("h2",s.title),node("p",s.intro));const levels=node("div",undefined,"controls level");for(let i=0;i<DATA[mode].length;i++)button(levels,(i+1)+"단계",()=>start(mode,i),{pressed:i===level});game.append(levels);if(mode==="food")food(s);if(mode==="route")route(s);if(mode==="detect")detect(s);}
function status(t){const e=node("div",t,"status");e.setAttribute("role","status");game.append(e);}
function guide(t){const e=node("details");e.append(node("summary","부모님과 이야기해요"),node("p",t));game.append(e);}
function complete(){const box=node("div",undefined,"controls");if(level+1<DATA[mode].length)button(box,"다음 탐험",()=>start(mode,level+1),{primary:true});button(box,"다시 해보기",()=>start(mode,level));game.append(box);}
function food(s){const r=foodResult(s,state.a);game.append(node("h3","🧺 바구니에 남은 사과: "+r.left+"개"),node("p",s.reserve?"친구들에게 나눠 주고 "+s.reserve+"개 이상 남기는 것이 목표예요.":"모든 친구에게 필요한 만큼 나눠 주는 것이 목표예요.","small"));s.names.forEach((name,i)=>{const row=node("div",undefined,"animal"),info=node("div");info.append(node("strong",s.emoji[i]+" "+name),node("div","필요한 사과 "+s.need[i]+"개 · 받은 사과 "+state.a[i]+"개","small"),node("div","🍎".repeat(state.a[i])||"아직 받은 사과가 없어요.","apples"));const buttons=node("div",undefined,"controls");button(buttons,"−",()=>{state.a[i]--;state.attempted=false;render()},{disabled:state.a[i]===0,label:name+"에게서 사과 한 개 되돌리기"});button(buttons,"+",()=>{state.a[i]++;state.attempted=false;render()},{disabled:r.left===0,label:name+"에게 사과 한 개 주기"});row.append(info,buttons);game.append(row);});button(game,"나눈 결과 확인하기",()=>{state.attempted=true;render()},{primary:true});if(state.attempted){const shortage=s.names.filter((n,i)=>r.short[i]>0).map(n=>n);status(r.ok?"모든 친구가 필요한 만큼 받았어요. 남은 사과도 조건에 맞아요!":shortage.length?"아직 사과가 부족한 친구가 있어요: "+shortage.join(", ")+". 다른 친구의 사과를 옮기거나 남은 사과를 써 보세요.":"친구들은 충분히 받았지만 늦게 오는 친구 몫이 부족해요. 바구니에 조금 돌려놓아 보세요.");if(r.ok)complete();}else status("친구마다 필요한 수를 살펴보고 사과를 옮겨 보세요.");guide("똑같이 나누는 것과 필요한 만큼 나누는 것은 언제 다를까요? 아이가 먼저 이유를 설명하게 해 주세요.")}
function route(s){const grid=node("div",undefined,"grid");grid.style.gridTemplateColumns="repeat("+s.w+",1fr)";grid.setAttribute("role","img");grid.setAttribute("aria-label","로봇 지도. 로봇은 출발점, 꽃은 도착점, 돌은 지나갈 수 없는 칸입니다.");const same=(a,x,y)=>a[0]===x&&a[1]===y;for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const wall=s.walls.some(a=>same(a,x,y)),trail=state.result?.path.some(a=>same(a,x,y)),last=state.result?.path.at(-1)||s.start;const e=node("div",wall?"🪨":same(last,x,y)?"🤖":same(s.goal,x,y)?"🌼":trail?"•":"","cell"+(wall?" wall":trail?" trail":""));grid.append(e)}game.append(grid,node("p","로봇은 화살표 한 개마다 한 칸 움직여요. 돌이나 지도 밖으로 갈 수 없어요."),node("h3","이동 명령: "+state.cmds.length+" / "+s.limit+"개"),node("div",state.cmds.map(d=>dirs[d]).join(" ")||"화살표를 눌러 길을 만들어 보세요.","seq"));const c=node("div",undefined,"controls");for(const d of ["U","L","D","R"])button(c,dirs[d],()=>{state.cmds.push(d);state.result=null;render()},{disabled:state.cmds.length>=s.limit,label:dirNames[d]+"으로 한 칸 추가"});button(c,"마지막 지우기",()=>{state.cmds.pop();state.result=null;render()},{disabled:!state.cmds.length});button(c,"모두 지우기",()=>{state.cmds=[];state.result=null;render()},{disabled:!state.cmds.length});game.append(c);button(game,"로봇 출발!",()=>{state.result=runRoute(s,state.cmds);render()},{primary:true,disabled:!state.cmds.length});if(state.result){let r=state.result;status(r.ok?"꽃밭에 도착했어요! 네가 만든 길을 따라 로봇이 움직였어요.":r.reason==="wall"?(r.at+1)+"번째 명령에서 길이 막혔어요. 그 앞의 위치를 보고 명령을 고쳐 보세요.":"로봇이 아직 꽃밭에 닿지 않았어요. 멈춘 위치를 보고 길을 더 만들어 보세요.");if(r.ok)complete()}else status("출발하기 전에 로봇이 어디로 움직일지 예상해 보세요.");guide("어느 명령에서 로봇이 멈췄나요? 바로 답을 알려주기보다 그 칸에서 가능한 방향을 함께 살펴보세요.")}
function detect(s){game.append(node("h3","1. 단서 조사하기"));s.clues.forEach((c,i)=>{const box=node("div",undefined,"clue"),seen=state.seen.includes(i);button(box,seen?"✓ "+c[0]:c[0]+" 살펴보기",()=>{if(!seen)state.seen.push(i);state.attempted=false;render()},{pressed:seen});if(seen)box.append(node("p",c[1]));game.append(box)});game.append(node("h3","2. 가장 근거가 많은 설명 고르기"));s.ideas.forEach((t,i)=>button(game,t,()=>{state.idea=i;state.attempted=false;render()},{pressed:state.idea===i} ).classList.add("choice"));game.append(node("h3","3. 그 설명을 뒷받침하는 단서 두 개 고르기"));state.seen.slice().sort((a,b)=>a-b).forEach(i=>{const l=node("label"),cb=node("input");cb.type="checkbox";cb.checked=state.proof.includes(i);cb.disabled=!cb.checked&&state.proof.length>=2;cb.addEventListener("change",()=>{state.proof=cb.checked?[...state.proof,i]:state.proof.filter(x=>x!==i);state.attempted=false;render()});l.append(cb,document.createTextNode(s.clues[i][0]+" — "+s.clues[i][1]));game.append(l)});const r=detectiveResult(s,state.idea,state.seen,state.proof);button(game,"내 생각 확인하기",()=>{state.attempted=true;render()},{primary:true,disabled:!r.ready});if(state.attempted){status(r.ok?s.why:"아직 설명과 단서가 충분히 연결되지 않았어요. "+s.hint);if(r.ok)complete()}else status("단서 네 개를 모두 보고, 설명 하나와 근거 두 개를 골라 보세요.");guide("확인한 사실과 아직 모르는 일을 구분해 보세요. 아이에게 어떤 단서를 보고 그렇게 생각했는지 물어보세요.")}
start("food",0);
</script></body></html>
