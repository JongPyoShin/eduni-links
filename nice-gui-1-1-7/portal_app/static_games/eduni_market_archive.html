<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시장 리서치 아카이브</title>
<style>
:root{color-scheme:light;--ink:#18263d;--muted:#64748b;--line:#dbe4ef;--blue:#2757a5;--paper:#f5f7fb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(at 90% 0,#e5edff,transparent 35%),var(--paper);font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:var(--ink)}main{max-width:1050px;margin:auto;padding:32px 20px 72px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:5px 0;font-size:clamp(27px,5vw,43px);letter-spacing:-.04em}.lead{color:var(--muted);margin:8px 0 0}.panel{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 40px #263c6010;margin:16px 0}.row{display:flex;gap:10px;align-items:center}input,button{font:inherit;border-radius:11px;padding:12px 14px}input{border:1px solid var(--line);min-width:0;flex:1;color:var(--ink)}button{border:0;background:var(--blue);color:white;font-weight:750;cursor:pointer}button.secondary{background:#edf2fa;color:var(--ink)}button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}.toolbar{display:flex;gap:10px;margin-bottom:14px}.list{display:grid;gap:10px}.article{border:1px solid var(--line);border-radius:14px;padding:15px;display:grid;grid-template-columns:auto 1fr;gap:13px}.article input{flex:none;accent-color:var(--blue)}.meta{font-size:12px;color:var(--muted);font-weight:700}.article h3{margin:4px 0 7px;font-size:17px}.article p{margin:0;color:#4b5a70;font-size:14px;line-height:1.55}.article a,.source{color:var(--blue);font-weight:700;text-decoration:none}.article-actions{display:flex;gap:12px;margin-top:10px;font-size:13px}.metadata{background:#fff5df;color:#855600}.reader{white-space:pre-wrap;line-height:1.85;color:#334155;max-height:65vh;overflow:auto}.reader-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.close{padding:6px 10px}.answer{white-space:pre-wrap;line-height:1.75}.status{color:var(--muted);font-size:13px;margin-top:10px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.badge{display:inline-block;background:#edf3ff;color:#234f9a;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750}h2{font-size:18px;margin:0 0 14px}@media(max-width:600px){main{padding:20px 12px 48px}.panel{padding:16px}.row{align-items:stretch}.toolbar{flex-direction:column}header{align-items:flex-start}}
.privacy-note{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.5}</style></head>
<body><main>
<header><div><div class="eyebrow">Premium archive · 935 articles</div><h1>시장 리서치 아카이브</h1><p class="lead">저장된 글을 검색하고, 글을 선택하면 해당 글만 참고하고, 선택하지 않으면 관련 글을 자동으로 찾습니다.</p><p class="privacy-note">질문 시 관련 글 최대 4개의 앞부분(각 350자)과 제목·날짜만 AI에 전달합니다. 원문 전체는 AI로 보내지 않습니다.</p></div><button id="logout" class="secondary hidden">잠금</button></header>
<section id="login" class="panel"><h2>보호자 PIN으로 열기</h2><form id="loginForm" class="row"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="64" placeholder="PIN" required><button>아카이브 열기</button></form><div id="loginStatus" class="status"></div></section>
<section id="archive" class="hidden">
<div class="panel"><div class="toolbar"><input id="query" maxlength="160" placeholder="제목과 본문 검색"><button id="search">검색</button></div><div id="results" class="list"></div><div class="pager"><button id="prev" class="secondary">이전</button><span id="count" class="meta"></span><button id="next" class="secondary">다음</button></div></div>
<div id="reader" class="panel hidden"><div class="reader-head"><div><h2 id="readerTitle"></h2><div id="readerMeta" class="meta"></div></div><button id="closeReader" type="button" class="secondary close">닫기</button></div><p id="readerNotice" class="status"></p><p id="readerText" class="reader"></p><a id="readerSource" class="source" target="_blank" rel="noopener noreferrer">네이버 프리미엄 원문 열기 ↗</a></div>
<div class="panel"><h2>질문할 글 선택 (선택 사항) <span id="selectedCount" class="badge">0 / 4</span></h2><form id="askForm"><div class="row"><input id="question" maxlength="180" placeholder="예: 저자가 보는 주요 위험 요인은 무엇인가요?" required><button>질문</button></div></form><div id="answer" class="answer" style="margin-top:16px"></div><div id="answerSources" class="article-actions"></div><div id="askStatus" class="status"></div></div>
</section></main>
<script>
const $=s=>document.querySelector(s);let page=1,total=0,selected=new Set(),lastArticles=[];
async function api(url,opts={}){return fetch(url,{credentials:'same-origin',cache:'no-store',...opts})}
function unlock(){ $('#login').classList.add('hidden');$('#archive').classList.remove('hidden');$('#logout').classList.remove('hidden');load(); }
async function load(){const q=$('#query').value.trim();const r=await api(`/portal/market/api/articles?q=${encodeURIComponent(q)}&page=${page}`);if(r.status===401){lock();return}const d=await r.json();if(!d.ok)return;total=d.total;$('#count').textContent=`${total.toLocaleString()}건 · ${page}페이지`;$('#prev').disabled=page<=1;$('#next').disabled=page*30>=total;$('#results').innerHTML=d.articles.map(a=>`<div class="article"><input type="checkbox" aria-label="AI 답변에 포함할 글 ${esc(a.title)}" data-id="${esc(a.id)}" ${selected.has(a.id)?'checked':''} ${a.has_content?'':'disabled'}><span><span class="meta">${esc(a.date)} · ${esc(a.category||'시장 분석')} ${a.has_content?'':'<span class="badge metadata">본문 미수집</span>'} ${a.has_video?'<span class="badge metadata">영상 포함</span>':''}</span><h3>${esc(a.title)}</h3><p>${esc(a.excerpt||'저장된 본문 발췌가 없습니다.')}</p><span class="article-actions"><button type="button" class="secondary read-button" data-id="${esc(a.id)}">${a.has_content?'본문 읽기':'보관 메타데이터 보기'}</button><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">네이버 원문 ↗</a></span></span></div>`).join('')||'<p class="status">검색 결과가 없습니다.</p>';$('#results').querySelectorAll('input[type=checkbox]').forEach(el=>el.onchange=()=>{if(el.checked&&selected.size>=4){el.checked=false;return}el.checked?selected.add(el.dataset.id):selected.delete(el.dataset.id);$('#selectedCount').textContent=`${selected.size} / 4`});$('#results').querySelectorAll('.read-button').forEach(el=>el.onclick=()=>readArticle(el.dataset.id))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function readArticle(id){const r=await api(`/portal/market/api/articles/${encodeURIComponent(id)}`);if(r.status===401){lock();return}const d=await r.json();if(!d.ok)return;const a=d.article;$('#readerTitle').textContent=a.title;$('#readerMeta').textContent=`${a.date} · ${a.category||'시장 분석'}`;$('#readerNotice').textContent=a.has_content?(a.has_video?'저장된 본문 · 원문에 영상 포함':'저장된 본문'):(a.has_video?'본문과 영상 자막이 수집되지 않은 영상 기록입니다.':'본문이 수집되지 않은 미디어 전용 기록입니다.');$('#readerText').textContent=a.text||'저장된 본문 텍스트가 없습니다.';$('#readerSource').href=a.url;$('#reader').classList.remove('hidden');$('#reader').scrollIntoView({behavior:'smooth',block:'start'})}
$('#closeReader').onclick=()=>$('#reader').classList.add('hidden');
function lock(){$('#archive').classList.add('hidden');$('#logout').classList.add('hidden');$('#login').classList.remove('hidden');selected.clear();$('#selectedCount').textContent='0 / 4'}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginStatus').textContent='확인 중…';const r=await api('/portal/market/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('#pin').value})});$('#pin').value='';if(r.ok){$('#loginStatus').textContent='';unlock()}else $('#loginStatus').textContent='PIN을 확인할 수 없습니다.'};
$('#search').onclick=()=>{page=1;load()};$('#query').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();page=1;load()}};$('#prev').onclick=()=>{page=Math.max(1,page-1);load()};$('#next').onclick=()=>{page++;load()};$('#logout').onclick=async()=>{await api('/portal/market/api/logout',{method:'POST'});lock()};
$('#askForm').onsubmit=async e=>{e.preventDefault();$('#askStatus').textContent='관련 글을 찾아 읽고 있습니다…';$('#answer').textContent='';$('#answerSources').replaceChildren();const r=await api('/portal/market/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('#question').value.trim(),article_ids:[...selected]})});const d=await r.json();if(r.ok){$('#answer').textContent=d.answer;for(const source of d.sources){const link=document.createElement('a');link.className='source';link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=`[${source.id}] ${source.date} · ${source.title} ↗`;$('#answerSources').append(link)}$('#askStatus').textContent='선택한 아카이브 발췌 기준의 답변입니다.'}else $('#askStatus').textContent='답변을 만들지 못했습니다. 잠시 후 다시 시도해 주세요.'};
</script></body></html>
