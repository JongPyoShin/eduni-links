<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>EDUNI 바둑</title>
  <style>
    :root{color-scheme:light;--bg:#f4f1e8;--ink:#17202a;--muted:#697386;--danger:#b42318;--ok:#137a4a;font-family:"Segoe UI","Malgun Gothic",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff9eb 0%,var(--bg) 55%,#ece3d2 100%);color:var(--ink)}button,select,a{font:inherit}
    .shell{width:min(100%,1020px);margin:0 auto;padding:14px 12px 26px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.title-wrap h1{margin:0;font-size:clamp(24px,5vw,36px)}.title-wrap p{margin:4px 0 0;color:var(--muted);font-weight:700}.portal-link{min-height:42px;display:inline-flex;align-items:center;padding:0 14px;border-radius:10px;background:#fff;color:var(--ink);text-decoration:none;border:1px solid #d9dce2;font-weight:800;white-space:nowrap}
    .game-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}.board-card,.side-card{background:rgba(255,255,255,.96);border:1px solid rgba(23,32,42,.08);border-radius:16px;box-shadow:0 14px 34px rgba(49,37,20,.09)}.board-card{padding:12px}.board-wrap{width:100%;aspect-ratio:1/1;display:grid;place-items:center;border-radius:12px;background:#c98f43;overflow:hidden;touch-action:none;user-select:none}#board{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
    .status-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{min-height:66px;padding:10px;border-radius:11px;background:#f7f8fa;border:1px solid #e5e7eb;display:grid;align-content:center;text-align:center}.stat b{font-size:18px}.stat span{color:var(--muted);font-size:12px;font-weight:800}.side-card{padding:14px;display:grid;gap:12px}.turn-box{padding:14px;border-radius:12px;background:#1f2937;color:white;text-align:center}.turn-box strong{display:block;font-size:21px}.turn-box span{display:block;margin-top:4px;color:#d1d5db;font-size:13px}.control-block{display:grid;gap:7px}.control-block label{color:var(--muted);font-size:12px;font-weight:900}select,.btn{min-height:46px;border-radius:11px;border:1px solid #d7dbe2;background:white;color:var(--ink);font-weight:800;padding:0 12px}.btn{cursor:pointer}.btn.primary{background:#2f5f45;color:white;border-color:#2f5f45}.btn.warn{color:var(--danger)}.btn:disabled{opacity:.5;cursor:not-allowed}.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .level-note{padding:9px 11px;border-radius:10px;background:#eef4f0;color:#315143;font-size:12px;font-weight:800;line-height:1.45}.message{min-height:54px;padding:11px 12px;border-radius:10px;background:#fff8e7;border:1px solid #f1ddb0;color:#60431e;font-size:14px;font-weight:750;line-height:1.45}.message.error{background:#fff0ee;border-color:#f3c8c3;color:var(--danger)}.message.ok{background:#ebf8f1;border-color:#b9e0ca;color:var(--ok)}
    .coach-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #dfe4e8;border-radius:11px;background:#f8faf9;font-weight:900}.coach-toggle input{width:22px;height:22px}.coach-card{display:none;padding:12px;border-radius:13px;border:2px solid #e7c76b;background:#fffdf4;box-shadow:0 8px 20px rgba(0,0,0,.08)}.coach-card.active{display:grid;gap:9px}.coach-head{display:flex;gap:8px;align-items:flex-start}.coach-icon{font-size:24px;line-height:1}.coach-title{font-weight:950;font-size:17px}.coach-summary{margin-top:2px;color:#564526;font-size:14px;line-height:1.45;font-weight:800}.coach-badges{display:flex;flex-wrap:wrap;gap:6px}.badge{font-size:12px;font-weight:900;padding:4px 7px;border-radius:999px;background:#eef7f1;color:#17633d}.badge.warn{background:#fff0e7;color:#a84c12}.badge.danger{background:#fff0ee;color:#a42b1d}.mini-wrap{display:grid;grid-template-columns:124px 1fr;gap:10px;align-items:center}.mini-wrap canvas{width:124px;height:124px;border-radius:10px;background:#d7a85d;border:1px solid #ba8741}.legend{font-size:11px;line-height:1.55;color:var(--muted);font-weight:800}.coach-actions{display:flex;gap:8px}.coach-actions .btn{flex:1}.rules{border-top:1px solid #eceef2;padding-top:10px;color:var(--muted);font-size:12px;line-height:1.5}.result{display:none;padding:14px;border-radius:12px;background:#f3f7f5;border:1px solid #cfe0d7;text-align:center;font-weight:900}.result.active{display:block}
    @media(max-width:780px){.shell{padding:10px 8px 18px}.topbar{align-items:flex-start}.game-grid{grid-template-columns:1fr}.side-card{grid-template-columns:1fr 1fr}.turn-box,.message,.result,.rules,.coach-toggle,.coach-card,.level-note{grid-column:1/-1}}
    @media(max-width:430px){.portal-link{min-height:38px;padding:0 10px;font-size:13px}.board-card{padding:8px}.side-card{grid-template-columns:1fr;padding:10px}.turn-box,.message,.result,.rules,.coach-toggle,.coach-card,.level-note{grid-column:auto}.status-strip{gap:5px}.stat{min-height:58px;padding:6px}.stat b{font-size:15px}.button-grid{gap:6px}.btn,select{min-height:44px}.mini-wrap{grid-template-columns:112px 1fr}.mini-wrap canvas{width:112px;height:112px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="topbar"><div class="title-wrap"><h1>EDUNI 바둑</h1><p id="boardSubtitle">초급 9×9 · 실시간 코치와 배우는 바둑</p></div><a class="portal-link" href="/portal">← 포털</a></header>
  <section class="game-grid">
    <div class="board-card"><div class="board-wrap"><canvas id="board" width="720" height="720" aria-label="9×9 바둑판"></canvas></div><div class="status-strip"><div class="stat"><b id="blackCaptured">0</b><span>흑이 잡은 돌</span></div><div class="stat"><b id="moveCount">0</b><span>진행 수</span></div><div class="stat"><b id="whiteCaptured">0</b><span>백이 잡은 돌</span></div></div></div>
    <aside class="side-card">
      <div class="turn-box"><strong id="turnText">흑 차례</strong><span id="modeText">AI와 두기 · 나는 흑</span></div>
      <div class="control-block"><label for="level">바둑판 · 학습 레벨</label><select id="level"><option value="beginner">초급 · 9×9</option><option value="intermediate">중급 · 13×13</option><option value="standard">정규 · 19×19</option></select></div>
      <div id="levelNote" class="level-note"></div>
      <div class="control-block"><label for="mode">게임 모드</label><select id="mode"><option value="ai">AI와 두기</option><option value="local">둘이 두기</option></select></div>
      <label class="coach-toggle"><span>🧑‍🏫 실시간 바둑 코치</span><span><input id="coachEnabled" type="checkbox" checked aria-label="실시간 바둑 코치 켜기"> ON</span></label>
      <div class="button-grid"><button class="btn primary" id="newGame" type="button">새 게임</button><button class="btn" id="pass" type="button">한 수 쉬기</button><button class="btn warn" id="resign" type="button">기권</button><button class="btn" id="hint" type="button">도움말</button></div>
      <div id="coachCard" class="coach-card" aria-live="polite"><div class="coach-head"><div id="coachIcon" class="coach-icon">✅</div><div><div id="coachTitle" class="coach-title">여기는 둘 수 있어요</div><div id="coachSummary" class="coach-summary"></div></div></div><div id="coachBadges" class="coach-badges"></div><div class="mini-wrap"><canvas id="miniBoard" width="160" height="160"></canvas><div class="legend">🟢 초록 점 = 착수 후 활로<br>🔴 빨간 X = 잡히는 돌<br>🟠 주황 링 = 단수 위험<br>🟡 노란 테두리 = 보고 있는 자리</div></div><div id="coachActions" class="coach-actions"><button id="confirmMove" class="btn primary" type="button">여기에 두기</button><button id="cancelPreview" class="btn" type="button">다른 곳 보기</button></div></div>
      <div id="message" class="message">빈 교차점을 눌러 흑돌을 놓아 보세요.</div><div id="result" class="result"></div><div id="rules" class="rules"></div>
    </aside>
  </section>
</main>
<script>
(()=>{'use strict';
const EMPTY=0,BLACK=1,WHITE=2,DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const LEVELS={
  beginner:{id:'beginner',name:'초급',size:9,komi:6.5,coach:'쉬운 말',note:'9×9에서 활로·단수·잡기를 천천히 익혀요.',ai:{capture:60,atari:8,liberties:1.5,neighbors:1.9,center:.7,edge:2.2,jitter:5.2,delay:430}},
  intermediate:{id:'intermediate',name:'중급',size:13,komi:6.5,coach:'전술 설명',note:'13×13에서 연결·끊기·단수를 함께 살펴봐요.',ai:{capture:72,atari:10,liberties:1.9,neighbors:2.3,center:.58,edge:1.6,jitter:2.6,delay:360}},
  standard:{id:'standard',name:'정규',size:19,komi:6.5,coach:'상세 설명',note:'19×19 정규판에서 활로와 전술 근거를 더 자세히 보여줘요.',ai:{capture:86,atari:12,liberties:2.2,neighbors:2.7,center:.46,edge:1.1,jitter:1.2,delay:300}}
};
let levelId='beginner',boardSize=LEVELS[levelId].size,komi=LEVELS[levelId].komi,starPoints=starPointsForSize(boardSize);
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),miniBoard=document.getElementById('miniBoard'),miniCtx=miniBoard.getContext('2d');
const turnText=document.getElementById('turnText'),modeText=document.getElementById('modeText'),messageEl=document.getElementById('message'),resultEl=document.getElementById('result'),modeSelect=document.getElementById('mode'),levelSelect=document.getElementById('level'),levelNote=document.getElementById('levelNote'),subtitle=document.getElementById('boardSubtitle'),rulesEl=document.getElementById('rules'),blackCapturedEl=document.getElementById('blackCaptured'),whiteCapturedEl=document.getElementById('whiteCaptured'),moveCountEl=document.getElementById('moveCount'),passButton=document.getElementById('pass'),resignButton=document.getElementById('resign'),coachEnabledEl=document.getElementById('coachEnabled'),coachCard=document.getElementById('coachCard'),coachIcon=document.getElementById('coachIcon'),coachTitle=document.getElementById('coachTitle'),coachSummary=document.getElementById('coachSummary'),coachBadges=document.getElementById('coachBadges'),confirmMoveButton=document.getElementById('confirmMove'),cancelPreviewButton=document.getElementById('cancelPreview');
function profile(){return LEVELS[levelId]}function starPointsForSize(size){if(size===9)return[[2,2],[2,6],[4,4],[6,2],[6,6]];if(size===13)return[[3,3],[3,9],[6,6],[9,3],[9,9]];return[3,9,15].flatMap(r=>[3,9,15].map(c=>[r,c]))}
function applyLevel(nextId){levelId=LEVELS[nextId]?nextId:'beginner';const p=profile();boardSize=p.size;komi=p.komi;starPoints=starPointsForSize(boardSize);canvas.setAttribute('aria-label',`${boardSize}×${boardSize} 바둑판`);subtitle.textContent=`${p.name} ${boardSize}×${boardSize} · 실시간 코치와 배우는 바둑`;levelNote.textContent=`${p.note} · AI: ${p.name} · 코치: ${p.coach}`;rulesEl.textContent=`상대 돌의 활로를 모두 막으면 잡을 수 있어요. 자충수와 즉시 되따내기(패)는 둘 수 없고, 두 번 연속 패스하면 중국식 영역 점수로 판정합니다. 백은 덤 ${komi}집을 받아요.`}
function createBoard(){return Array.from({length:boardSize},()=>Array(boardSize).fill(EMPTY))}function cloneBoard(s){return s.map(r=>r.slice())}function boardKey(s){return s.map(r=>r.join('')).join('/')}function inside(r,c){return r>=0&&c>=0&&r<boardSize&&c<boardSize}
function groupAt(source,row,col){const color=source[row]?.[col]??EMPTY;if(color===EMPTY)return{stones:[],liberties:[]};const q=[[row,col]],seen=new Set([`${row},${col}`]),libs=new Set(),stones=[];for(let i=0;i<q.length;i++){const[r,c]=q[i];stones.push([r,c]);for(const[dr,dc]of DIRS){const nr=r+dr,nc=c+dc;if(!inside(nr,nc))continue;if(source[nr][nc]===EMPTY)libs.add(`${nr},${nc}`);else if(source[nr][nc]===color){const k=`${nr},${nc}`;if(!seen.has(k)){seen.add(k);q.push([nr,nc])}}}}return{stones,liberties:[...libs].map(v=>v.split(',').map(Number))}}
function removeGroup(source,stones){for(const[r,c]of stones)source[r][c]=EMPTY}
function tryMove(source,row,col,color,koState=null){if(!inside(row,col))return{legal:false,reason:'바둑판 안에 놓아 주세요.',reasonCode:'outside'};if(source[row][col]!==EMPTY)return{legal:false,reason:'이미 돌이 있는 자리예요.',reasonCode:'occupied'};const next=cloneBoard(source);next[row][col]=color;const opp=color===BLACK?WHITE:BLACK;let captured=0;const capturedStones=[],checked=new Set();for(const[dr,dc]of DIRS){const nr=row+dr,nc=col+dc;if(!inside(nr,nc)||next[nr][nc]!==opp)continue;const mark=`${nr},${nc}`;if(checked.has(mark))continue;const g=groupAt(next,nr,nc);g.stones.forEach(([gr,gc])=>checked.add(`${gr},${gc}`));if(g.liberties.length===0){captured+=g.stones.length;capturedStones.push(...g.stones);removeGroup(next,g.stones)}}const own=groupAt(next,row,col);if(own.liberties.length===0)return{legal:false,reason:'자충수는 둘 수 없어요.',reasonCode:'suicide'};const key=boardKey(next);if(koState&&key===koState)return{legal:false,reason:'패 때문에 바로 되따낼 수 없어요.',reasonCode:'ko'};return{legal:true,board:next,captured,capturedStones,liberties:own.liberties.length,key}}
function legalMoves(source,color,koState){const out=[];for(let r=0;r<boardSize;r++)for(let c=0;c<boardSize;c++){const result=tryMove(source,r,c,color,koState);if(result.legal)out.push({row:r,col:c,result})}return out}
function scoreBoard(source){let bs=0,ws=0,bt=0,wt=0;const seen=new Set();for(let r=0;r<boardSize;r++)for(let c=0;c<boardSize;c++){if(source[r][c]===BLACK)bs++;if(source[r][c]===WHITE)ws++;if(source[r][c]!==EMPTY||seen.has(`${r},${c}`))continue;const q=[[r,c]],region=[],borders=new Set();seen.add(`${r},${c}`);for(let i=0;i<q.length;i++){const[rr,cc]=q[i];region.push([rr,cc]);for(const[dr,dc]of DIRS){const nr=rr+dr,nc=cc+dc;if(!inside(nr,nc))continue;const v=source[nr][nc];if(v===EMPTY){const k=`${nr},${nc}`;if(!seen.has(k)){seen.add(k);q.push([nr,nc])}}else borders.add(v)}}if(borders.size===1&&borders.has(BLACK))bt+=region.length;if(borders.size===1&&borders.has(WHITE))wt+=region.length}const black=bs+bt,white=ws+wt+komi;return{black,white,blackStones:bs,whiteStones:ws,blackTerritory:bt,whiteTerritory:wt}}
function enemyAtariCount(source,color){const opp=color===BLACK?WHITE:BLACK,seen=new Set();let count=0;for(let r=0;r<boardSize;r++)for(let c=0;c<boardSize;c++){if(source[r][c]!==opp||seen.has(`${r},${c}`))continue;const g=groupAt(source,r,c);g.stones.forEach(([gr,gc])=>seen.add(`${gr},${gc}`));if(g.liberties.length===1)count+=g.stones.length}return count}
function aiCandidateMoves(source,koState){const empties=new Set(),hasStone=source.some(row=>row.some(Boolean));if(!hasStone){for(const[r,c]of starPoints)empties.add(`${r},${c}`);const m=Math.floor(boardSize/2);empties.add(`${m},${m}`)}else{for(let r=0;r<boardSize;r++)for(let c=0;c<boardSize;c++)if(source[r][c]!==EMPTY)for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){if(Math.abs(dr)+Math.abs(dc)>3)continue;const nr=r+dr,nc=c+dc;if(inside(nr,nc)&&source[nr][nc]===EMPTY)empties.add(`${nr},${nc}`)}}let candidates=[...empties].map(k=>k.split(',').map(Number));if(!candidates.length)return legalMoves(source,WHITE,koState);const moves=[];for(const[row,col]of candidates){const result=tryMove(source,row,col,WHITE,koState);if(result.legal)moves.push({row,col,result})}return moves.length?moves:legalMoves(source,WHITE,koState)}
function aiPickMove(source,koState){const moves=aiCandidateMoves(source,koState);if(!moves.length)return null;const w=profile().ai,center=(boardSize-1)/2,maxCenter=(boardSize-1),beforeAtari=enemyAtariCount(source,WHITE);let bestScore=-Infinity,best=[];for(const move of moves){const{row,col,result}=move;const centerDistance=Math.abs(center-row)+Math.abs(center-col);let neighbors=0,ownNeighbors=0;for(const[dr,dc]of DIRS){const nr=row+dr,nc=col+dc;if(inside(nr,nc)&&source[nr][nc]!==EMPTY){neighbors++;if(source[nr][nc]===WHITE)ownNeighbors++}}const afterAtari=enemyAtariCount(result.board,WHITE);const components={capture:result.captured*w.capture,atari:Math.max(0,afterAtari-beforeAtari)*w.atari,liberties:result.liberties*w.liberties,neighbors:neighbors*w.neighbors,center:(maxCenter-centerDistance)*w.center,edge:(row===0||row===boardSize-1||col===0||col===boardSize-1)?-w.edge:0,jitter:Math.random()*w.jitter};const score=Object.values(components).reduce((a,b)=>a+b,0);move.aiAnalysis={total:score,beforeAtari,afterAtari,components,ownNeighbors};if(score>bestScore+.001){bestScore=score;best=[move]}else if(Math.abs(score-bestScore)<=.001)best.push(move)}return best[Math.floor(Math.random()*best.length)]}
function strongestAiReason(move){const c=move?.aiAnalysis?.components||{},rank=[['capture',c.capture||0],['atari',c.atari||0],['neighbors',c.neighbors||0],['liberties',c.liberties||0],['center',c.center||0]].sort((a,b)=>b[1]-a[1])[0]?.[0];if(rank==='capture'&&move.result?.captured>0)return`흑돌 ${move.result.captured}개를 잡을 수 있어서예요.`;if(rank==='atari'&&(move.aiAnalysis.afterAtari-move.aiAnalysis.beforeAtari)>0)return'흑돌의 활로를 줄여 단수를 만들기 좋은 자리예요.';if(rank==='neighbors')return'주변 백돌과 이어지거나 흑돌을 압박하기 좋은 자리예요.';if(rank==='liberties')return`백돌의 활로를 ${move.result?.liberties||0}개 확보하기 좋은 자리예요.`;return boardSize===19?'여러 방향으로 펼치기 좋은 중심 영향력을 보고 고른 수예요.':'가운데에 가깝고 다음 수를 이어가기 쉬운 자리예요.'}
function uniqueGroupKeys(groups){return new Set(groups.map(g=>g.stones.map(([r,c])=>`${r},${c}`).sort().join('|'))).size}
function analyzeMove(source,row,col,color,koState=null){const result=tryMove(source,row,col,color,koState);if(!result.legal)return{legal:false,reasonCode:result.reasonCode,title:result.reasonCode==='ko'?'패 때문에 잠깐 기다려요':'여기는 지금 둘 수 없어요',summary:result.reason,visual:{candidate:[row,col],liberties:[],captured:[],atari:[]}};const opp=color===BLACK?WHITE:BLACK,ownBefore=[],oppAtari=[],seenOwn=new Set(),seenOpp=new Set();for(const[dr,dc]of DIRS){const nr=row+dr,nc=col+dc;if(!inside(nr,nc))continue;if(source[nr][nc]===color){const g=groupAt(source,nr,nc),key=g.stones.map(([r,c])=>`${r},${c}`).sort().join('|');if(!seenOwn.has(key)){seenOwn.add(key);ownBefore.push(g)}}}for(let r=0;r<boardSize;r++)for(let c=0;c<boardSize;c++){if(result.board[r][c]!==opp||seenOpp.has(`${r},${c}`))continue;const g=groupAt(result.board,r,c);g.stones.forEach(([gr,gc])=>seenOpp.add(`${gr},${gc}`));if(g.liberties.length===1)oppAtari.push(g)}const own=groupAt(result.board,row,col),connected=uniqueGroupKeys(ownBefore),selfAtari=result.captured===0&&own.liberties.length===1,rescued=ownBefore.filter(g=>g.liberties.length===1&&g.liberties[0][0]===row&&g.liberties[0][1]===col).length;let title='여기는 둘 수 있어요',summary=`놓은 뒤 내 돌의 활로는 ${own.liberties.length}개예요.`,reasonCode='legal';const badges=[];if(result.captured){reasonCode='capture';summary=`여기에 두면 상대 돌 ${result.captured}개를 잡아요.`;badges.push(`포획 ${result.captured}개`)}else if(rescued){reasonCode='rescue';summary='위험했던 내 돌의 숨 쉴 곳을 넓혀 주는 수예요.';badges.push('내 돌 구출')}else if(oppAtari.length){reasonCode='atari';summary='상대 돌의 활로가 1개만 남아 단수가 돼요.';badges.push('상대 단수')}else if(connected>=2){reasonCode='connect';summary='떨어져 있던 내 돌이 이 자리에서 이어져요.';badges.push('내 돌 연결')}else if(selfAtari){reasonCode='self_atari';title='둘 수는 있지만 조심해요';summary='내 돌의 활로가 1개뿐이라 다음 수에 잡힐 수 있어요.';badges.push('활로 1개')}if(levelId==='intermediate'&&!result.captured)summary+=` 현재 활로 ${own.liberties.length}개를 확보해요.`;if(levelId==='standard')summary+=` 연결 그룹 ${connected}개, 상대 단수 그룹 ${oppAtari.le
