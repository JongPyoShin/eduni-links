<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="cache-control" content="no-store" />
    <title>EDUNI Jungle — 거대한 고목</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #3f4d36; font-family: system-ui, sans-serif; }
      #three-giant-tree-game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #objective-hud { position: fixed; top: 14px; left: 14px; max-width: min(390px, calc(100vw - 28px)); z-index: 5; padding: 10px 14px; border-radius: 14px; background: rgba(47,53,32,.84); border: 1px solid rgba(255,226,158,.44); color: #fff8df; font-weight: 850; font-size: clamp(13px,2.1vw,18px); box-shadow: 0 7px 24px rgba(0,0,0,.25); }
      #objective-hud.objective-change { animation: objective-change .42s ease; }
      @keyframes objective-change { 0% { transform: translateY(5px); opacity: .3; } 70% { transform: translateY(-1px); opacity: 1; } 100% { transform: none; } }
      #status { position: fixed; top: 62px; left: 14px; z-index: 5; color: #ece4c4; font-size: 11px; background: rgba(42,46,29,.58); padding: 5px 8px; border-radius: 9px; pointer-events: none; }
      #dpad { position: fixed; left: 18px; bottom: 18px; width: 168px; height: 168px; z-index: 8; }
      .dbtn { position: absolute; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 13px; background: rgba(255,246,216,.18); border: 2px solid rgba(255,236,181,.42); color: #fff; font-size: 20px; font-weight: 800; user-select: none; touch-action: none; }
      #dpad-up { left: 58px; top: 0; } #dpad-left { left: 0; top: 58px; } #dpad-right { left: 116px; top: 58px; } #dpad-down { left: 58px; top: 116px; }
      #dpad-a { position: fixed; right: 18px; bottom: 84px; width: 66px; height: 66px; border-radius: 50%; z-index: 8; background: rgba(94,180,92,.52); border-color: rgba(154,240,141,.84); }
      #dpad-b { position: fixed; right: 94px; bottom: 18px; width: 66px; height: 66px; border-radius: 50%; z-index: 8; background: rgba(198,105,82,.46); border-color: rgba(247,166,133,.8); }
      .dbtn:active { background: rgba(255,255,255,.38); }
      #modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; background: rgba(21,25,15,.64); }
      #modal .card { width: min(400px, calc(100vw - 34px)); max-height: calc(100vh - 34px); overflow-y: auto; border-radius: 22px; padding: 22px; text-align: center; background: #fffaf0; box-shadow: 0 24px 70px rgba(0,0,0,.46); }
      #modal .card h2 { margin: 7px 0; color: #4c4935; } #modal .card p { white-space: pre-line; color: #5f6652; line-height: 1.55; }
      #modal-img { display: none; width: 150px; height: 150px; object-fit: contain; margin: 0 auto 8px; }
      #modal-progress { min-height: 18px; color: #7a6e4e; font-weight: 800; font-size: 13px; }
      #modal-choices { display: grid; gap: 8px; margin: 14px 0; text-align: left; }
      .choice { padding: 11px 12px; border-radius: 12px; border: 2px solid #e8dfc9; color: #535842; font-weight: 780; }
      .choice.focused { border-color: #c99845; box-shadow: 0 0 0 3px rgba(213,165,78,.18); } .choice.selected { background: #f3ebcf; }
      .response { min-height: 20px; color: #66705b; font-weight: 750; } .response.gentle { color: #9a6c2f; }
      .gentle-shake { animation: gentle-shake .34s ease; } @keyframes gentle-shake { 0%,100%{transform:none}35%{transform:translateX(-5px)}70%{transform:translateX(5px)} }
      #modal-confirm { border: 0; border-radius: 12px; padding: 11px 18px; background: #688b4d; color: #fff; font-weight: 850; font-size: 15px; }
      #modal-hint { margin-top: 12px; color: #7d8372; font-size: 12px; }
      #reward-badge { display: none; place-items: center; margin: 0 auto 12px; width: 94px; height: 94px; border-radius: 50%; font-size: 46px; background: radial-gradient(circle at 32% 24%,#fff 0 7%,#ffe59a 8% 24%,#d9a34c 25% 52%,#66854b 53% 78%,#3e5435 79%); border: 4px solid #fff0a7; box-shadow: 0 5px 0 #9b762f, 0 10px 28px rgba(218,166,72,.34); }
      .reward-reveal #reward-badge { animation: badge-reveal .9s ease both, badge-shine 2s 1s infinite; }
      #reward-summary { display: grid; gap: 5px; margin: 10px auto 14px; text-align: left; width: min(270px,100%); }
      .reward-item { opacity: 0; color: #5d7048; font-weight: 760; animation: reward-item .36s ease forwards; }
      @keyframes badge-reveal { from { opacity:0; transform:scale(.66) rotate(-8deg); } 70% { opacity:1; transform:scale(1.08) rotate(3deg); } to { transform:scale(1); } }
      @keyframes badge-shine { 0%,55% { filter:brightness(1) } 65% { filter:brightness(1.5) } 78%,100% { filter:brightness(1) } }
      @keyframes reward-item { from { opacity:0; transform:translateX(-8px) } to { opacity:1; transform:none } }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/loaders/DRACOLoader.js": "./src/local_draco_loader.js",
          "three/addons-local/": "./node_modules/three/examples/jsm/",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="three-giant-tree-game"></canvas>
    <div id="objective-hud" aria-live="polite">거대한 뿌리 사이의 입구를 찾아가 보자</div>
    <div id="status">거대한 고목 준비 중…</div>
    <div id="dpad"><div class="dbtn" id="dpad-up">▲</div><div class="dbtn" id="dpad-left">◀</div><div class="dbtn" id="dpad-right">▶</div><div class="dbtn" id="dpad-down">▼</div></div>
    <div class="dbtn" id="dpad-a">A</div><div class="dbtn" id="dpad-b">B</div>
    <div id="modal"><div class="card"><div id="reward-badge" aria-label="고목 씨앗 배지">🌰</div><img id="modal-img" alt="" /><div id="modal-progress"></div><h2 id="modal-title">거대한 고목</h2><p id="modal-body"></p><div id="modal-response" class="response"></div><div id="modal-choices"></div><div id="reward-summary"></div><button id="modal-confirm" type="button">계속</button><div id="modal-hint">A / Enter로 계속 · B / Escape로 닫기</div></div></div>
    <script type="module">
      import { startGiantTreeGame } from "./src/giant_tree_game.js";
      startGiantTreeGame(document.querySelector("#three-giant-tree-game"), document.querySelector("#modal"), document.querySelector("#status")).catch((error) => {
        console.error(error); document.querySelector("#status").textContent = `고목 게임 시작 실패: ${error?.message || error}`;
      });
    </script>
  </body>
</html>
