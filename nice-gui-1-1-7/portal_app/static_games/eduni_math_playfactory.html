*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 12% 4%,#fff3d5 0,transparent 35%),linear-gradient(165deg,#fffdfa,#fff6e7);-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #5676ff;outline-offset:2px}button:disabled{opacity:.48;cursor:not-allowed}.shell{max-width:1100px;margin:auto;padding:24px 22px 72px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:23px}.brand{display:flex;align-items:center;gap:10px;font-size:clamp(20px,3vw,27px);font-weight:900;letter-spacing:-1.2px;cursor:pointer}.brand-icon{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:#ff9b26;box-shadow:0 5px 0 #e67b19;font-size:26px}.header-right{display:flex;align-items:center;gap:9px}.badge{border:1px solid #ffe1a4;background:#fff0c8;color:#986004;padding:9px 12px;border-radius:100px;font-size:13px;font-weight:850}.round-btn{border:1px solid var(--line);background:white;border-radius:100px;min-height:44px;min-width:44px;display:inline-grid;place-items:center;padding:0 12px;box-shadow:0 3px 0 #eee6da;font-size:20px}.hero{border-radius:30px;padding:36px 42px;background:linear-gradient(115deg,#ffa329,#ffc553);position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:226px}.hero:before,.hero:after{content:'';position:absolute;border:2px solid #ffdb8d;border-radius:50%;opacity:.6}.hero:before{width:310px;height:310px;right:-60px;top:-170px}.hero:after{width:160px;height:160px;right:210px;bottom:-115px}.hero h1{margin:0 0 11px;font-size:clamp(29px,4.1vw,44px);line-height:1.22;letter-spacing:-1.8px;font-weight:950;position:relative;z-index:1}.hero p{font-size:clamp(15px,2vw,18px);font-weight:750;line-height:1.55;margin:0;color:#653e10;position:relative;z-index:1}.hero-art{positio lor:#77717c;font-size:15px;font-weight:650}.two-col{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(285px,1fr);align-items:start;gap:17px}.panel{background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:23px}.panel h3{font-size:19px;letter-spacing:-.7px;margin:0 0 17px}.btn{border:none;border-radius:15px;padding:12px 19px;min-height:47px;background:var(--ink);color:white;font-weight:900;box-shadow:0 4px 0 #101219;transition:transform .12s}.btn:active,.round-btn:active,.back:active{transform:translateY(3px);box-shadow:none}.btn.secondary{background:#fff4dd;color:#9a631e;box-shadow:0 4px 0 #ecdabb}.btn.pink{background:#ff73ac;box-shadow:0 4px 0 #e24c8b}.btn.blue{background:#4787f2;box-shadow:0 4px 0 #3165bf}.btn.green{background:#2caa73;box-shadow:0 4px 0 #1b8255}.btn-row{display:flex;gap:10px;flex-wrap:wrap}.level-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.level{padding:10px 13px;border:2px solid #f1e8db;border-radius:12px;background:#fff;min-height:43px;font-weight:850;color:#777}.level.active{border-color:#ffab37;background:#fff3d6;color:#a96604}.progressbar{display:flex;align-items:center;gap:8px;margin-bottom:20px}.progressbar .dot{width:19px;height:19px;background:#f1ecdf;border-radius:50%}.progressbar .dot.on{background:#ffae43;box-shadow:0 2px 0 #dd872b}.number-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.number-tile{border:2px solid #f5e2bc;background:linear-gradient(145deg,#fff9e9,#ffe8b5);box-shadow:0 5px 0 #e9c585;border-radius:15px;min-height:92px;padding:10px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;transition:transform .12s,border-color .12s}.number-tile strong{font-size:clamp(19px,3vw,28px);font-variant-numeric:tabular-nums}.number-tile small{color:#9b712f;font-size:12px;font-weight:850}.number-tile.selected{background:linear-gradient(145deg,#d9ecff,#acd7ff);border-color:#428bef;box-shadow:0 5px 0 #75a8e1;transform:translateY(-2px)}.number-tile.hint{outline:3px dashed #ef7362;outline-offset:2px}.target-box{border-radius:22px;background:linear-gradient(160deg,#fff5dc,#ffebbc);border:1px solid #ffe3aa;text-align:center;padding:26px 14px;margin-bottom:18px}.target-box .tiny{font-size:14px;color:#9c7227;font-weight:850}.target-box .target{font-size:clamp(48px,8vw,75px);font-weight:950;color:#ef8c16;font-variant-numeric:tabular-nums;line-height:1.24}.target-box .sum{margin-top:15px;background:#fff;border-radius:14px;padding:13px;font-size:19px;font-weight:850;box-shadow:0 3px 0 #f6dbab}.target-box .sum b{color:#e27f15;font-size:24px}.guide{background:#f7f8fc;padding:15px 17px;border-radius:15px;font-size:14px;line-height:1.7;color:#646b7b;font-weight:700;margin-bottom:18px}.guide strong{color:#404757}.helper{margin:16px 0 0;font-size:13px;line-height:1.6;color:#84818b}.shape-stage{background:#f3f7fc;box-shadow:inset 0 3px 12px #46617a0d;border:1px solid #e5eaf1;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:12px;min-height:330px}.shape-stage svg{width:100%;max-width:400px;height:auto;aspect-ratio:360/320;overflow:visible}.slot{cursor:pointer}.slot .outline{stroke:#aebcce;stroke-width:3.5;stroke-dasharray:6 6;fill:#fff;fill-opacity:.7;transition:stroke .15s}.slot:hover .outline{stroke:#f8a232}.slot.hint .outline{stroke:#ff7a42;stroke-width:5}.slot.filled{cursor:default}.slot.filled .outline{stroke:white;stroke-width:3.5;stroke-dasharray:none;fill-opacity:1}.pieces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:15px}.piece{min-height:120px;background:#fff;border:2px solid #e5e6ed;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px;gap:3px}.piece svg{height:75px;width:95px;max-width:100%}.piece span{font-size:12px;font-weight:900;color:#636878}.piece.selected{border-color:#4b84e8;background:#eef6ff;box-shadow:0 4px 0 #bdd3ff}.piece.used{opacity:.3;background:#f2f4f8}.shape-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px;font-weight:900}.shape-head .stage-label{border-radius:30px;background:#edf1ff;padding:9px 12px;color:#6e6ab1;font-size:13px}.rotate-panel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 16px}.instruction{font-size:13px;line-height:1.65;color:#81808e}.board{display:grid;gap:4px;padding:10px;background:#dfe5ee;border:6px solid #48586b;border-radius:18px;width:min(100%,420px);aspect-ratio:1;margin:auto}.cell{min-width:0;min-height:0;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-weight:900;font-size:clamp(14px,2.8vw,24px);user-select:none;transition:background .13s}.cell.anchor{background:#e6ffeb;cursor:pointer}.cell.anchor:after{content:'+';position:absolute;right:5%;top:1%;font-size:11px;color:#47b475}.cell.occu{color:#fff;text-shadow:0 1px #0002;border:2px solid #ffffffa0}.cell.bad{animation:shake .2s 2}.spatial-pieces{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}.spatial-piece{border:2px solid #e7e8ed;background:white;border-radius:16px;padding:8px 10px;min-height:116px;display:flex;align-items:center;gap:12px;text-align:left}.spatial-piece.selected{background:#eaf4ff;border-color:#4b8aeb}.spatial-piece.used{opacity:.38;pointer-events:none}.mini-grid{display:grid;grid-template-columns:repeat(4,17px);grid-template-rows:repeat(4,17px);gap:2px;flex-shrink:0}.mini-grid div{border-radius:3px}.spatial-piece b{font-size:14px;line-height:1.45}.spatial-piece small{font-size:12px;color:#868393}.game-message{padding:12px 15px;margin:15px 0 0;background:#eff8ff;border-radius:13px;font-weight:800;color:#446c9b;line-height:1.6;font-size:14px;min-height:46px}.success{background:#e9ffef;color:#22864b}.winning{position:fixed;inset:0;z-index:100;background:#151b2b86;display:flex;align-items:center;justify-content:center;padding:20px}.winning-card{background:#fff;max-width:410px;width:100%;border-radius:30px;padding:35px 25px;text-align:center;box-shadow:0 25px 65px #1118}.winning-emoji{font-size:70px;animation:bob 1.5s ease-in-out infinite}.winning-card h2{font-size:30px;margin:9px 0 10px}.winning-card p{line-height:1.7;color:#68707e;margin:0 0 23px}.win-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.toast{position:fixed;z-index:110;bottom:27px;left:50%;transform:translateX(-50%);min-width:220px;max-width:calc(100vw - 32px);padding:13px 21px;background:#333745;color:#fff;text-align:center;border-radius:30px;font-size:14px;font-weight:800;box-shadow:0 12px 30px #0003;pointer-events:none;animation:up .2s}.shake{animation:shake .22s}.legend{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#7e7e87;font-weight:750;font-size:13px;margin:15px auto 0;max-width:420px}.counter{font-weight:900;color:#e1881a}.confetti{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:99}.confetti i{position:absolute;top:-15px;width:9px;height:13px;opacity:.85;animation:fall 2s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}@keyframes up{from{transform:translate(-50%,15px);opacity:0}to{transform:translate(-50%,0);opacity:1}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@keyframes bob{50%{transform:translateY(-9px)}}
@media(max-width:780px){.shell{padding:16px 13px 50px}.hero{padding:32px 25px;min-height:205px}.hero-art{right:8px;font-size:77px;bottom:-3px;opacity:.75}.cards{grid-template-columns:1fr}.game-card{min-height:0;flex-direction:row}.game-art{width:38%;min-height:174px;height:auto;flex-shrink:0}.game-art svg{width:96%;height:115px}.game-info{padding:18px}.game-info h3{font-size:20px}.two-col{grid-template-columns:1fr}.panel{padding:17px}.number-tile{min-height:82px}.shape-stage{min-height:250px}.pieces{grid-template-columns:repeat(3,1fr)}.section-h{margin-top:28px}.hero h1{max-width:390px}.hero p{max-width:300px}}

<body>
<div id="app" class="shell"></div><div id="overlay"></div><div id="toast-root"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const app=$('#app');
const trophy=(()=>{try{return JSON.parse(localStorage.getItem('math-play-trophy')||'{"number":0,"shape":0,"spatial":0}')}catch(e){return {number:0,shape:0,spatial:0}}})();
let screen='home',sound=true,toastTimer;
const names={number:'수와 연산',shape:'평면도형',spatial:'공간전략게임'};
function saveTrophy(key,count){trophy[key]=Math.max(trophy[key]||0,count);try{localStorage.setItem('math-play-trophy',JSON.stringify(trophy))}catch(e){}}
function iconHome(){return '<span class="brand-icon">🧮</span><span>수학 놀이터</span>'}
function header(){return `<header class="header"><div class="brand" role="button" tabindex="0" onclick="go('home')" onkeydown="if(event.key==='Enter')go('home')">${iconHome()}</div><div class="header-right"><a class="portal-back" href="/portal/world/math" aria-label="EDUNI 수학탐험대로 돌아가기">🏠 포털</a><span class="badge">7세도 재미있게 🎈</span><button class="round-btn" onclick="toggleSound()" title="소리 켜기 또는 끄기" aria-label="소리 켜기 또는 끄기">${sound?'🔊':'🔇'}</button></div></header>`}
function toggleSound(){sound=!sound;render()}
function tone(freq=660,len=.10){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+len);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+len);o.onended=()=>ctx.close()}catch(e){}}
function toast(msg){const root=$('#toast-root');clearTimeout(toastTimer);root.innerHTML=`<div class="toast" role="status"></div>`;root.firstChild.textContent=msg;toastTimer=setTimeout(()=>root.innerHTML='',1900)}
function confetti(){const d=document.createElement('div');d.className='confetti';for(let i=0;i<40;i++){let b=document.createElement('i');b.style.left=Math.random()*100+'%';b.style.background=['#f9a232','#5abae6','#fa79b1','#86cb88','#997de8'][i%5];b.style.animationDelay=Math.random()*.6+'s';b.style.transform=`rotate(${Math.random()*360}deg)`;d.appendChild(b)}document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function win(title,desc,againFn,againName='다시 도전',moreFn=null,moreName='다음 단계'){tone(740,.12);setTimeout(()=>tone(960,.2),140);confetti();$('#overlay').innerHTML=`<div class="winning" role="dialog" aria-modal="true"><div class="winning-card"><div class="winning-emoji">🏆</div><h2>${title}</h2><p>${desc}</p><div class="win-actions"><button class="btn secondary" id="win-again">${againName}</button>${moreFn?`<button class="btn green" id="win-more">${moreName}</button>`:''}<button class="btn blue" id="win-home">처음 화면</button></div></div></div>`;$('#win-again').onclick=()=>{$('#overlay').innerHTML='';againFn()};if(moreFn)$('#win-more').onclick=()=>{$('#overlay').innerHTML='';moreFn()};$('#win-home').onclick=()=>{$('#overlay').innerHTML='';go('home')}}
function backdrop(title,description,tag){return `<div class="game-top"><button class="back" onclick="go('home')">← 다른 게임</button><div class="pill">${tag}</div></div><h1 class="game-title">${title}</h1><p class="game-desc">${description}</p>`}
function render(){app.innerHTML=header()+(screen==='home'?home():screen==='number'?renderNumber():screen==='shape'?renderShape():renderSpatial())}
function go(to){screen=to;$('#overlay').innerHTML='';clearTimeout(toastTimer);$('#toast-root').innerHTML='';if(to==='number'&&!numberState)setupNumber('1000');if(to==='shape'&&!shapeState)setupShape(0);if(to==='spatial'&&!spaceState)setupSpatial(0);render();window.scrollTo({top:0,behavior:'smooth'})}
function home(){return `<section class="hero"><h1>놀면서 배우는<br>수학 모험! ✨</h1><p>숫자를 더하고, 도형을 맞추고,<br>빈칸을 채우는 신나는 3가지 게임</p><div class="hero-art" aria-hidden="true">🧩</div></section><div class="section-h"><h2>오늘은 어떤 게임을 할까?</h2><span>원하는 게임을 눌러 시작해요</span></div><section class="cards"><button class="game-card" onclick="go('number')"><div class="game-art art-1"><svg viewBox="0 0 210 130" aria-hidden="true"><rect x="17" y="16" width="176" height="101" rx="13" fill="#f9c66b" transform="rotate(-8 100 65)"/><g font-weight="900" text-anchor="middle" font-size="18"><circle cx="62" cy="47" r="20" fill="white"/><text x="62" y="53" fill="#eb8a13">200</text><circle cx="125" cy="39" r="20" fill="#fff"/><text x="125" y="45" fill="#d8820d">300</text><circle cx="91" cy="94" r="22" fill="#fff"/><text x="91" y="100" fill="#d8820d">500</text></g></svg></div><div class="game-info"><div class="eyebrow">GAME 01 · 숫자</div><h3>수와 연산</h3><p>숫자를 골라 목표 숫자를 만들어 봐요. 반올림도 배울 수 있어요.</p><span class="start">시작하기 → ${trophy.number?'⭐ '+trophy.number:''}</span></div></button><button class="game-card" onclick="go('shape')"><div class="game-art art-2"><svg viewBox="0 0 210 130" aria-hidden="true"><polygon points="32,85 100,17 100,85" fill="#ff8a61"/><polygon points="108,19 176,85 108,85" fill="#55c0e8"/><rect x="56" y="85" width="50" height="40" fill="#ffdc5a"/><rect x="109" y="85" width="50" height="40" fill="#a996ed"/><polygon points="170,25 195,49 170,49" fill="#75cf9a"/></svg></div><div class="game-info"><div class="eyebrow">GAME 02 · 도형</div><h3>평면도형</h3><p>삼각형과 사각형 조각을 돌려 실루엣에 맞춰 보아요.</p><span class="start">시작하기 → ${trophy.shape?'⭐ '+trophy.shape:''}</span></div></button><button class="game-card" onclick="go('spatial')"><div class="game-art art-3"><svg viewBox="0 0 210 130" aria-hidden="true"><rect x="34" y="8" width="142" height="116" rx="8" fill="#fff" stroke="#bdc2e2" stroke-width="3"/>${Array.from({length:4},(_,r)=>Array.from({length:4},(_,c)=>`<rect x="${40+c*33}" y="${14+r*26}" width="30" height="23" rx="3" fill="${r<2&&c<2?'#ff80b0':r<2&&c>1?'#ffd24d':r===2?'#69caf3':'#98dfa0'}" stroke="#fff" stroke-width="1.5"/>`).join('')).join('')}</svg></div><div class="game-info"><div class="eyebrow">GAME 03 · 전략</div><h3>공간전략게임</h3><p>블록을 회전해서 빈칸 없이 보드를 채워요.</p><span class="start">시작하기 → ${trophy.spatial?'⭐ '+trophy.spatial:''}</span></div></button></section><div class="footnote">사진 속 놀이에서 착안한 오리지널 디지털 교육 게임 · 인터넷 없이 실행 가능</div>`}
// ───── GAME 1 · NUMBER ─────
let numberState=null;
const levels={10:{target:10,step:1,sol:[[2,3,5],[1,4,5],[3,3,4],[2,2,6]]},100:{target:100,step:10,sol:[[20,30,50],[10,40,50],[30,30,40],[20,20,60]]},1000:{target:1000,step:100,sol:[[200,300,500],[100,400,500],[300,300,400],[200,200,600]]}};
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function mkNumberRound(level){const cfg=levels[level],base=cfg.sol[Math.floor(Math.random()*cfg.sol.length)],units=cfg.step;
let values=base.map((x,i)=>({id:'a'+i,value:units===1?x:x+Math.round((Math.random()-.5)*units*.7),solution:true}));
for(let i=0;i<9;i++){let x=units*(1+Math.floor(Math.random()*9));values.push({id:'b'+i,value:units===1?x:x+Math.round((Math.random()-.5)*units*.7),solution:false})}
return shuffle(values)}
function setupNumber(level){numberState={level,round:0,tiles:mkNumberRound(level),selected:[],hint:false,completed:false}}
function nRounded(val){const c=levels[numberState.level];return Math.round(val/c.step)*c.step}
function nSum(){return numberState.tiles.filter(t=>numberState.selected.includes(t.id)).reduce((a,t)=>a+nRounded(t.value),0)}
function renderNumber(){const s=numberState,c=levels[s.level],sum=nSum();return backdrop('🧮 수와 연산','숫자 타일을 골라 목표 합계를 만들어 봐요. 맞힐 때마다 별을 받아요!','숫자 골라 더하기')+`<div class="two-col"><section class="panel"><div class="level-row">${Object.entries(levels).map(([k,v])=>`<button class="level ${s.level===k?'active':''}" onclick="changeNumberLevel('${k}')">${v.target.toLocaleString()} 만들기</button>`).join('')}</div><div class="progressbar" aria-label="성공한 문제 ${s.round}개, 목표 5개">${Array.from({length:5},(_,i)=>`<span class="dot ${i<s.round?'on':''}"></span>`).join('')}<span style="margin-left:auto;color:#9e7b35;font-weight:850;font-size:13px">${s.round} / 5 성공 ⭐</span></div><div class="number-grid">${s.tiles.map(t=>`<button class="number-tile ${s.selected.includes(t.id)?'selected':''} ${s.hint&&t.solution?'hint':''}" onclick="pickNumber('${t.id}')" aria-pressed="${s.selected.includes(t.id)}" ${s.completed?'disabled':''}><strong>${t.value}</strong>${c.step>1?`<small>반올림 → ${nRounded(t.value)}</small>`:'<small>더하기</small>'}</button>`).join('')}</div><p class="helper">한 번 누르면 선택, 다시 누르면 선택 취소! 원하는 만큼 골라도 괜찮아요.</p></section><section class="panel"><h3>🎯 이번 문제의 목표</h3><div class="target-box"><div class="tiny">합계를 만들어요</div><div class="target">${c.target.toLocaleString()}</div><div class="sum">지금까지 <b>${sum.toLocaleString()}</b> ${sum===c.target&&s.selected.length?'🎉':`/ ${c.target.toLocaleString()}`}</div></div><div class="guide">${c.step===1?'💛 <strong>숫자를 그대로 더해요.</strong> 먼저 작은 숫자를 골라 보세요!':`💡 <strong>${c.step===10?'일의 자리':'십의 자리'}를 반올림</strong>해서 더해요.<br>예: ${c.step===10?'24 → 20, 36 → 40':'260 → 300, 440 → 400'}`}</div><div class="btn-row"><button class="btn secondary" onclick="numberHint()">💡 힌트</button><button class="btn" onclick="numberClear()">↺ 선택 지우기</button></div><div class="game-message ${sum===c.target&&s.selected.length?'success':''}" id="number-msg" role="status">${sum>c.target?'목표보다 커요. 숫자 하나를 빼 볼까요?':sum===0?'어떤 숫자부터 골라볼까요? 😄':sum<c.target?`목표까지 ${(c.target-sum).toLocaleString()} 남았어요!`:'정답이에요! ✨'}</div></section></div>`}
function changeNumberLevel(k){setupNumber(k);tone(520);render()}
function pickNumber(id){const s=numberState;if(s.completed)return;let index=s.selected.indexOf(id);if(index>=0)s.selected.splice(index,1);else s.selected.push(id);s.hint=false;tone(460+s.selected.length*90,.06);const sum=nSum(),target=levels[s.level].target;if(sum===target&&s.selected.length){s.completed=true;s.round++;saveTrophy('number',s.round);render();setTimeout(()=>{if(screen!=='number'||numberState!==s)return;if(s.round>=5)win('숫자 박사 탄생!','5문제를 모두 맞혔어요. 반올림도 척척! 정말 멋져요. ⭐⭐⭐',()=>{setupNumber(s.level);render()});else{s.tiles=mkNumberRound(s.level);s.selected=[];s.hint=false;s.completed=false;render();toast('정답! 다음 문제로 출발 🎉')}},700)}else render()}
function numberHint(){const s=numberState;s.selected=[];s.hint=true;render();toast('점선으로 표시된 타일을 골라 보세요!')}
function numberClear(){numberState.selected=[];numberState.hint=false;render()}
// ───── GAME 2 · 2-D SHAPES ─────
const shapeTemplates={big:{label:'큰 삼각형',pts:'-57,55 57,55 -57,-59',color:'#fb9660'},mid:{label:'중간 삼각형',pts:'-44,43 44,43 -44,-45',color:'#ffcb55'},small:{label:'작은 삼각형',pts:'-32,32 32,32 -32,-32',color:'#72cfbb'},square:{label:'정사각형',pts:'-39,-39 39,-39 39,39 -39,39',color:'#8fb1f4'},para:{label:'평행사변형',pts:'-49,-28 17,-28 49,28 -17,28',color:'#c09ae9'},rect:{label:'직사각형',pts:'-38,-52 38,-52 38,52 -38,52',color:'#f2a2b1'}};
const shapePuzzles=[
{title:'알록달록 집',emoji:'🏠',slots:[['big',115,105,270],['big',229,105,90],['square',123,223,0],['square',204,223,0],['small',82,287,90],['small',279,281,180]]},
{title:'바다 위 배',emoji:'⛵',slots:[['big',122,115,0],['big',235,117,270],['rect',169,254,90],['small',76,267,270],['small',293,267,180],['para',186,58,0]]},
{title:'우주 로켓',emoji:'🚀',slots:[['big',144,91,180],['big',215,91,270],['rect',180,202,0],['small',99,264,90],['small',258,264,180],['para',180,307,0]]}
];
let shapeState=null;
function setupShape(stage){const puzzle=shapePuzzles[stage],slots=puzzle.slots.map((v,i)=>({id:'s'+i,type:v[0],x:v[1],y:v[2],ang:v[3],filled:null})),pieces=shuffle(slots.map((v,i)=>({id:'p'+i,type:v.type,rot:0,used:false})));shapeState={stage,slots,pieces,selected:pieces[0]?.id||null,hintSlot:null}}
function selectedShape(){return shapeState.pieces.find(p=>p.id===shapeState.selected)}
function svgPoly(type,fill='#fff',stroke='#fff',width=3){return `<polygon points="${shapeTemplates[type].pts}" fill="${fill}" stroke="${stroke}" stroke-width="${width}" stroke-linejoin="round"/>`}
function slotSvg(slot){const piece=shapeState.pieces.find(p=>p.id===slot.filled);let type=slot.type;return `<g class="slot ${piece?'filled':''} ${shapeState.hintSlot===slot.id?'hint':''}" data-slot="${slot.id}" onclick="placeShape('${slot.id}')" transform="translate(${slot.x},${slot.y}) rotate(${slot.ang})"><polygon class="outline" points="${shapeTemplates[type].pts}" ${piece?`fill="${shapeTemplates[type].color}" style="fill:${shapeTemplates[type].color}"`:''}/>${piece?'':`<text text-anchor="middle" x="0" y="9" font-size="24" font-weight="900" fill="#c1cad6" transform="rotate(${-slot.ang})">?</text>`}</g>`}
function pieceSvg(piece){const t=shapeTemplates[piece.type];return `<svg viewBox="-72 -75 144 150" aria-hidden="true"><g transform="rotate(${piece.rot})">${svgPoly(piece.type,t.color,'#fff',3)}</g></svg>`}
function shapeCompleted(){return shapeState.slots.every(s=>s.filled)}
function renderShape(){const s=shapeState,p=shapePuzzles[s.stage],selected=selectedShape(),filled=s.slots.filter(v=>v.filled).length;return backdrop('🔺 평면도형','도형 조각을 골라 돌린 다음, 같은 모양의 점선 자리를 눌러요.','도형 회전 + 자리 찾기')+`<div class="two-col"><section class="panel"><div class="shape-head"><strong>${p.emoji} ${p.title}</strong><span class="stage-label">${s.stage+1} / ${shapePuzzles.length}단계</span></div><div class="shape-stage"><svg viewBox="0 0 360 340" role="img" aria-label="도형을 맞추는 실루엣 퍼즐"><circle cx="37" cy="47" r="8" fill="#e4eafb"/><circle cx="319" cy="47" r="5" fill="#e1ebfb"/><circle cx="316" cy="305" r="8" fill="#ecf1ff"/>${s.slots.map(slotSvg).join('')}</svg></div><div class="legend"><span>점선 모양을 채워 보세요</span><span class="counter">${filled} / ${s.slots.length} 조각</span></div><div class="game-message" id="shape-msg" role="status">${filled===s.slots.length?'퍼즐 완성!':selected?`선택한 도형: ${shapeTemplates[selected.type].label} · ${selected.rot}°`:'조각을 골라 보세요.'}</div></section><section class="panel"><h3>🧩 내 도형 조각</h3><div class="pieces">${s.pieces.map(piece=>`<button class="piece ${s.selected===piece.id?'selected':''} ${piece.used?'used':''}" onclick="selectShape('${piece.id}')" aria-label="${shapeTemplates[piece.type].label}, ${piece.rot}도 회전" ${piece.used?'disabled':''}>${pieceSvg(piece)}<span>${shapeTemplates[piece.type].label}</span></button>`).join('')}</div><div class="rotate-panel"><button class="btn blue" onclick="rotateShape()" ${!selected?'disabled':''}>↻ 90° 돌리기</button><button class="btn secondary" onclick="hintShape()">💡 힌트</button></div><div class="guide"><strong>놀이 방법</strong><br>① 조각을 골라요.<br>② 모양이 다르면 90°씩 돌려요.<br>③ 왼쪽 점선 모양을 눌러 넣어요.</div><div class="btn-row"><button class="btn secondary" onclick="setupShape(${s.stage});render()">↺ 처음부터</button>${s.stage>0?`<button class="btn secondary" onclick="setupShape(${s.stage-1});render()">이전 단계</button>`:''}</div><p class="helper">삼각형은 방향까지 맞춰야 해요. 정사각형은 어느 방향이든 맞아요.</p></section></div>`}
function selectShape(id){let p=shapeState.pieces.find(p=>p.id===id);if(!p||p.used)return;shapeState.selected=id;shapeState.hintSlot=null;tone(490,.055);render()}
function rotateShape(){const p=selectedShape();if(!p)return;p.rot=(p.rot+90)%360;shapeState.hintSlot=null;tone(600,.05);render()}
function angleFits(piece,slot){const diff=((piece.rot-slot.ang)%360+360)%360;if(piece.type==='square')return true;if(piece.type==='rect'||piece.type==='para')return diff===0||diff===180;return diff===0}
function placeShape(slotId){let s=shapeState,slot=s.slots.find(v=>v.id===slotId),piece=selectedShape();if(!slot||slot.filled)return;if(!piece){toast('먼저 조각을 골라 주세요!');return}if(slot.type!==piece.type){tone(230,.12);toast('다른 도형이에요. 모양을 잘 살펴보세요 👀');return}if(!angleFits(piece,slot)){tone(290,.12);toast('모양은 맞아요! 90°씩 돌려보세요 ↻');return}slot.filled=piece.id;piece.used=true;s.selected=s.pieces.find(q=>!q.used)?.id||null;s.hintSlot=null;tone(640,.08);render();if(shapeCompleted()){saveTrophy('shape',s.stage+1);const next=s.stage+1<shapePuzzles.length?()=>{setupShape(s.stage+1);render()}:null;setTimeout(()=>{if(screen==='shape'&&shapeState===s)win('도형 퍼즐 완성!',`${puzzleName(s.stage)} 모양을 완성했어요! 공간 감각이 쑥쑥 자라요.`,()=>{setupShape(s.stage);render()},'한 번 더',next,next?'다음 모양':'')},350)}}
function puzzleName(i){return shapePuzzles[i].title}
function hintShape(){const s=shapeState,p=selectedShape();if(!p){toast('모든 조각을 완성했어요!');return}const slot=s.slots.find(t=>!t.filled&&t.type===p.type);if(!slot){toast('다른 조각을 골라 보세요');return}s.hintSlot=slot.id;render();toast(`점선 자리 확인! ${slot.ang}° 방향으로 돌려요`)}
// ───── GAME 3 · SPATIAL STRATEGY ─────
const SHAPES={O4:[[0,0],[0,1],[1,0],[1,1]],I4:[[0,0],[0,1],[0,2],[0,3]],I3:[[0,0],[0,1],[0,2]],L3:[[0,0],[1,0],[1,1]],T4:[[0,0],[0,1],[0,2],[1,1]],L4:[[0,0],[1,0],[2,0],[2,1]]};
const spatialStages=[{n:4,pieces:['O4','O4','I4','I4'],name:'네모 채우기',emoji:'🌱'},{n:4,pieces:['O4','L3','L3','I3','L3'],name:'꺾인 조각',emoji:'🌼'},{n:5,pieces:['I3','L3','O4','T4','I4','L4','I3'],name:'전략가 도전',emoji:'🚀'}];
const colors=['#f58aab','#60bde1','#e6b34d','#99a0ec','#62c69a','#ed9c76','#9e83d9'];
const shapeNames={O4:'네모 4칸',I4:'막대 4칸',I3:'막대 3칸',L3:'ㄱ자 3칸',T4:'ㅜ자 4칸',L4:'긴 ㄱ자 4칸'};
let spaceState=null;
function normalizeCells(cells){let r0=Math.min(...cells.map(x=>x[0])),c0=Math.min(...cells.map(x=>x[1]));return cells.map(([r,c])=>[r-r0,c-c0]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])}
function rotateCells(cells,count){let o=cells.map(x=>[...x]);for(let i=0;i<count;i++)o=o.map(([r,c])=>[c,-r]);return normalizeCells(o)}
function setupSpatial(stage){const s=spatialStages[stage];spaceState={stage,n:s.n,board:Array(s.n*s.n).fill(null),selected:0,rot:0,pieces:s.pieces.map((t,i)=>({type:t,id:i,color:colors[i],used:false})),history:[],hint:null}}
function pieceCells(p,rot){return rotateCells(SHAPES[p.type],rot)}
function anchoredCells(p,rot){const cells=pieceCells(p,rot),first=cells[0];return cells.map(([r,c])=>[r-first[0],c-first[1]])}
function previewSpot(s,p,r,c,rot){const cells=anchoredCells(p,rot);let indices=[];for(const [dr,dc] of cells){let rr=r+dr,cc=c+dc;if(rr<0||rr>=s.n||cc<0||cc>=s.n)return null;let ix=rr*s.n+cc;if(s.board[ix]!==null)return null;indices.push(ix)}return indices}
function spatialSelected(){return spaceState.pieces.find(p=>p.id===spaceState.selected&&!p.used)||null}
function validAnchors(){const s=spaceState,p=spatialSelected();if(!p)return [];let res=[];for(let r=0;r<s.n;r++)for(let c=0;c<s.n;c++)if(previewSpot(s,p,r,c,s.rot))res.push(r*s.n+c);return res}
function miniShapeSvg(p,rot){const cells=pieceCells(p,rot),filled=new Set(cells.map(([r,c])=>r*4+c));return `<div class="mini-grid">${Array.from({length:16},(_,i)=>`<div style="background:${filled.has(i)?p.color:'transparent'};border:${filled.has(i)?'1px solid #ffffff8b':'none'}"></div>`).join('')}</div>`}
function renderSpatial(){const s=spaceState,stage=spatialStages[s.stage],p=spatialSelected(),anchors=new Set(validAnchors());let count=s.board.filter(v=>v!==null).length;return backdrop('🟪 공간전략게임','조각을 돌려서 보드에 놓아요. 서로 겹치지 않게 모든 칸을 채우면 성공!','블록 배치 + 공간 감각')+`<div class="two-col"><section class="panel"><div class="shape-head"><strong>${stage.emoji} ${stage.name}</strong><span class="stage-label">${s.stage+1} / ${spatialStages.length}단계</span></div><div class="board" style="grid-template-columns:repeat(${s.n},1fr);grid-template-rows:repeat(${s.n},1fr)" aria-label="${s.n} 곱하기 ${s.n} 칸 보드">${s.board.map((v,i)=>`<div class="cell ${v!==null?'occu':anchors.has(i)?'anchor':''}" role="button" tabindex="0" onclick="putSpatial(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();putSpatial(${i})}" style="${v!==null?`background:${s.pieces[v].color};`:''}" aria-label="${Math.floor(i/s.n)+1}행 ${i%s.n+1}열 ${v===null?'빈칸':'채운칸'}">${v!==null?'★':anchors.has(i)?'':''}</div>`).join('')}</div><div class="legend"><span>초록 칸을 누르면 블록이 들어가요</span><span class="counter">${count} / ${s.n*s.n} 칸</span></div><div class="game-message" id="spatial-msg" role="status">${count===s.n*s.n?'모든 칸을 채웠어요! 🎉':s.hint?`힌트: ${Math.floor(s.hint.index/s.n)+1}행 ${s.hint.index%s.n+1}열에 놓아 보세요.`:p?`${shapeNames[p.type]} 선택됨 · ${s.rot*90}° 회전`:'빈칸을 채워 주세요.'}</div></section><section class="panel"><h3>🧱 이번에 놓을 블록</h3><div class="spatial-pieces">${s.pieces.map(v=>`<button class="spatial-piece ${s.selected===v.id?'selected':''} ${v.used?'used':''}" onclick="selectSpatial(${v.id})" ${v.used?'disabled':''}>${miniShapeSvg(v,s.selected===v.id?s.rot:0)}<span><b>${shapeNames[v.type]}</b><br><small>${v.used?'배치 완료 ✓':'선택하기'}</small></span></button>`).join('')}</div><div class="rotate-panel"><button class="btn blue" onclick="rotateSpatial()" ${!p?'disabled':''}>↻ 90° 돌리기</button><button class="btn secondary" onclick="hintSpatial()">💡 힌트</button></div><div class="guide"><strong>놀이 방법</strong><br>① 블록 하나를 골라요.<br>② 방향을 90°씩 돌릴 수 있어요.<br>③ 초록색 칸을 누르면 놓여요.<br>④ 빈칸 없이 채우면 성공!</div><div class="btn-row"><button class="btn secondary" onclick="undoSpatial()" ${!s.history.length?'disabled':''}>↶ 한 수 되돌리기</button><button class="btn secondary" onclick="setupSpatial(${s.stage});render()">↺ 다시하기</button></div><p class="helper">어려우면 언제든지 힌트를 눌러 보세요. 초록색 자리가 없어도 회전하면 길이 열릴 수 있어요.</p></section></div>`}
function selectSpatial(id){const s=spaceState,p=s.pieces.find(p=>p.id===id);if(!p||p.used)return;s.selected=id;s.rot=0;s.hint=null;tone(480,.05);render()}
function rotateSpatial(){const s=spaceState;if(!spatialSelected())return;s.rot=(s.rot+1)%4;s.hint=null;tone(580,.06);render()}
function putSpatial(index){const s=spaceState,p=spatialSelected();if(!p)return;if(s.board[index]!==null){toast('이미 블록이 있는 칸이에요.');return}let r=Math.floor(index/s.n),c=index%s.n,indices=previewSpot(s,p,r,c,s.rot);if(!indices){tone(260,.10);toast('여기에는 놓을 수 없어요. 방향을 바꿔 볼까요?');return}s.history.push({id:p.id,indices:[...indices]});for(const ix of indices)s.board[ix]=p.id;p.used=true;s.selected=s.pieces.find(q=>!q.used)?.id??null;s.rot=0;s.hint=null;tone(620,.07);render();if(s.board.every(x=>x!==null)){saveTrophy('spatial',s.stage+1);let next=s.stage+1<spatialStages.length?()=>{setupSpatial(s.stage+1);render()}:null;setTimeout(()=>{if(screen==='spatial'&&spaceState===s)win('공간 전략 성공!','모든 칸을 빈틈없이 채웠어요. 멋진 공간 설계사예요! 🌟',()=>{setupSpatial(s.stage);render()},'한 번 더',next,next?'다음 단계':'')},350)}}
function undoSpatial(){const s=spaceState,v=s.history.pop();if(!v)return;for(const i of v.indices)s.board[i]=null;s.pieces[v.id].used=false;s.selected=v.id;s.rot=0;s.hint=null;tone(440,.07);render()}
function findSpatialSolution(){const s=spaceState,remaining=s.pieces.filter(p=>!p.used),occupied=new Set(s.board.map((v,i)=>v===null?-1:i).filter(i=>i>=0));const all=s.n*s.n;let seen=0;
function dfs(pending,fill,solution){if(++seen>140000)return null;if(pending.length===0)return fill.size===all?solution:null;let first=-1;for(let i=0;i<all;i++)if(!fill.has(i)){first=i;break}if(first===-1)return null;
for(const p of pending){let distinct=new Set();for(let rot=0;rot<4;rot++){const c=pieceCells(p,rot);let sign=c.map(v=>v.join(',')).join(';');if(distinct.has(sign))continue;distinct.add(sign);for(let k=0;k<c.length;k++){let ar=Math.floor(first/s.n)-c[k][0],ac=first%s.n-c[k][1];let indices=[],valid=true;for(let [dr,dc] of c){let r=ar+dr,col=ac+dc,idx=r*s.n+col;if(r<0||col<0||r>=s.n||col>=s.n||fill.has(idx)){valid=false;break}indices.push(idx)}if(!valid)continue;const next=new Set(fill);indices.forEach(i=>next.add(i));let result=dfs(pending.filter(q=>q.id!==p.id),next,[...solution,{id:p.id,index:(ar+c[0][0])*s.n+(ac+c[0][1]),rot}]);if(result)return result}}}return null}
return dfs(remaining,occupied,[])}
function hintSpatial(){const s=spaceState,solution=findSpatialSolution();if(!solution||!solution.length){toast('현재 배치로는 채우기 어려워요. ↶ 되돌리기를 눌러 보세요.');return}const move=solution[0];s.selected=move.id;s.rot=move.rot;s.hint=move;render();toast(`${shapeNames[s.pieces[move.id].type]}를 초록 칸에 놓아요!`)}
render();
</script>
