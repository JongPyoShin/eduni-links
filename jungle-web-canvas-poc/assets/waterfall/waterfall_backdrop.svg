  <linearGradient id="rock" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#8f9b87"/><stop offset=".48" stop-color="#657466"/><stop offset="1" stop-color="#3c5148"/></linearGradient>
  <linearGradient id="rockDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5e7568"/><stop offset="1" stop-color="#283f39"/></linearGradient>
