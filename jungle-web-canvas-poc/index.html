<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Jungle Camp — Web Canvas 2.5D PoC</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #1a2a1f; overflow: hidden; font-family: system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #dpad { position: fixed; left: 18px; bottom: 18px; width: 168px; height: 168px; }
      .dbtn {
        position: absolute; width: 52px; height: 52px; border-radius: 12px;
        background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.4);
        color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
        user-select: none; touch-action: none;
      }
      #dpad-up { left: 58px; top: 0; }
      #dpad-left { left: 0; top: 58px; }
      #dpad-right { left: 116px; top: 58px; }
      #dpad-down { left: 58px; top: 116px; }
      #dpad-a { position: fixed; right: 18px; bottom: 84px; width: 64px; height: 64px; border-radius: 50%; background: rgba(34,197,94,0.5); border: 2px solid rgba(34,197,94,0.9); }
      #dpad-b { position: fixed; right: 92px; bottom: 18px; width: 64px; height: 64px; border-radius: 50%; background: rgba(239,68,68,0.5); border: 2px solid rgba(239,68,68,0.9); }
      .dbtn:active { background: rgba(255,255,255,0.4); }
      #help { position: fixed; top: 10px; left: 10px; color: #d7f0dd; font-size: 12px; background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 8px; line-height: 1.5; }
      #modal {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.55); z-index: 10;
      }
      #modal .card {
        background: #fff; border-radius: 18px; padding: 22px; max-width: 340px; text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      #modal .card img { width: 160px; height: 160px; object-fit: contain; margin-bottom: 10px; }
      #modal .card h2 { margin: 6px 0; color: #0f172a; }
      #modal .card p { color: #334155; font-size: 14px; line-height: 1.5; }
      #modal .card .hint { margin-top: 12px; font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas></div>

    <div id="dpad">
      <div class="dbtn" id="dpad-up">▲</div>
      <div class="dbtn" id="dpad-left">◀</div>
      <div class="dbtn" id="dpad-right">▶</div>
      <div class="dbtn" id="dpad-down">▼</div>
    </div>
    <div class="dbtn" id="dpad-a">A</div>
    <div class="dbtn" id="dpad-b">B</div>

    <div id="modal">
      <div class="card">
        <img id="modal-img" alt="bluebird" />
        <h2 id="modal-title">Bluebird</h2>
        <p id="modal-fact"></p>
        <div class="hint">B / Escape to close</div>
      </div>
    </div>

    <script type="module">
      import { start } from "./src/game.js";
      const canvas = document.getElementById("game");
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);
      const modalEl = document.getElementById("modal");
      start(canvas, modalEl);
    </script>
  </body>
</html>
