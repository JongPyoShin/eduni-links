services:
  eduni-game:
    build:
      context: .
      dockerfile: nice-gui-1-1-7/Dockerfile
    container_name: eduni-game
    restart: unless-stopped
    depends_on:
      eduni-postgres:
        condition: service_healthy
    environment:
      EDUNI_HOST: 0.0.0.0
      PORT: 8080
      EDUNI_HANJA_DIR: /data/hanja
      EDUNI_PORTAL_DB: /data/eduni_portal.sqlite3
      EDUNI_READING_DATA_DIR: /data/reading-journal
      EDUNI_READING_DB_HOST: eduni-postgres
      EDUNI_READING_DB_PORT: 5432
      EDUNI_READING_DB_NAME: eduni
      EDUNI_READING_DB_USER: eduni
      EDUNI_READING_DB_PASSWORD: ${EDUNI_POSTGRES_PASSWORD:?Set EDUNI_POSTGRES_PASSWORD in .env}
    ports:
      - "100.75.214.95:8081:8080"
    volumes:
      - eduni_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  eduni-postgres:
    image: postgres:16
    container_name: eduni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduni
      POSTGRES_USER: eduni
      POSTGRES_PASSWORD: ${EDUNI_POSTGRES_PASSWORD:?Set EDUNI_POSTGRES_PASSWORD in .env}
    volumes:
      - eduni_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduni -d eduni"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  eduni_data:
  eduni_postgres_data:
