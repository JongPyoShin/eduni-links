<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="cache-control" content="no-store" />
    <title>EDUNI Jungle — 하늘 능선</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#7898b2; font-family:system-ui,sans-serif; }
      #sky-game { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
      #objective-hud { position:fixed; top:14px; left:14px; z-index:5; max-width:min(370px,calc(100vw - 28px)); padding:10px 14px; border-radius:14px; background:rgba(42,63,89,.8); border:1px solid rgba(242,250,255,.44); color:#fff; font-weight:850; font-size:clamp(13px,2.1vw,18px); box-shadow:0 7px 24px rgba(0,0,0,.2); }
      #context-hint { position:fixed; top:52px; left:14px; max-width:min(260px,calc(100vw - 28px)); color:#bae6fd; font-size:clamp(11px,1.8vw,14px); font-weight:600; background:rgba(42,63,89,.6); border:1px solid rgba(186,230,253,.3); padding:5px 10px; border-radius:10px; z-index:5; opacity:0; transform:translateY(-3px); transition:opacity .28s ease,transform .28s ease; }
      #context-hint.visible { opacity:1; transform:translateY(0); }
      #objective-hud.objective-change { animation:objective-change .42s ease; }
      @keyframes objective-change { 0%{transform:translateY(5px);opacity:.3}70%{transform:translateY(-1px);opacity:1}100%{transform:none} }
      #status { position:fixed; top:62px; left:14px; z-index:5; color:#e6f4ff; font-size:11px; background:rgba(34,51,72,.58); padding:5px 8px; border-radius:9px; pointer-events:none; }
      #dpad { position:fixed; left:18px; bottom:18px; width:168px; height:168px; z-index:8; }
      .dbtn { position:absolute; width:52px; height:52px; display:flex; align-items:center; justify-content:center; border-radius:13px; background:rgba(235,246,255,.18); border:2px solid rgba(235,246,255,.46); color:#fff; font-size:20px; font-weight:800; user-select:none; touch-action:none; }
      #dpad-up { left:58px; top:0; } #dpad-left { left:0; top:58px; } #dpad-right { left:116px; top:58px; } #dpad-down { left:58px; top:116px; }
      #dpad-a { position:fixed; right:18px; bottom:84px; width:66px; height:66px; border-radius:50%; z-index:8; background:rgba(70,205,142,.5); border-color:rgba(135,255,190,.86); }
      #dpad-b { position:fixed; right:94px; bottom:18px; width:66px; height:66px; border-radius:50%; z-index:8; background:rgba(218,91,116,.44); border-color:rgba(255,151,170,.8); }
      .dbtn:active { background:rgba(255,255,255,.38); }
      #modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:20; background:rgba(17,28,45,.58); }
      #modal .card { width:min(400px,calc(100vw - 34px)); max-height:calc(100vh - 34px); overflow-y:auto; border-radius:22px; padding:22px; text-align:center; background:#fffdf5; box-shadow:0 24px 70px rgba(0,0,0,.45); }
      #modal .card h2 { margin:7px 0; color:#354567; } #modal .card p { white-space:pre-line; color:#4b5f70; line-height:1.55; }
      #modal-img { display:none; width:150px; height:150px; object-fit:contain; margin:0 auto 8px; }
      #modal-progress { min-height:18px; color:#647394; font-weight:800; font-size:13px; }
      #modal-choices { display:grid; gap:8px; margin:14px 0; text-align:left; }
      .choice { padding:11px 12px; border-radius:12px; border:2px solid #dfe6ee; color:#3d4d62; font-weight:780; }
      .choice.focused { border-color:#d6ab44; box-shadow:0 0 0 3px rgba(226,181,75,.2); } .choice.selected { background:#fff5cf; }
      .response { min-height:20px; color:#5d6f7b; font-weight:750; } .response.gentle { color:#9c6a2d; }
      .gentle-shake { animation:gentle-shake .34s ease; } @keyframes gentle-shake { 0%,100%{transform:none}35%{transform:translateX(-5px)}70%{transform:translateX(5px)} }
      #modal-confirm { border:0; border-radius:12px; padding:11px 18px; background:#607bb1; color:#fff; font-weight:850; font-size:15px; }
      #modal-hint { margin-top:12px; color:#718096; font-size:12px; }
      #reward-badge { display:none; place-items:center; margin:0 auto 12px; width:94px; height:94px; border-radius:50%; font-size:46px; background:radial-gradient(circle at 32% 24%,#fff 0 7%,#fff2a9 8% 24%,#7bc6e1 25% 56%,#5e6ba8 57% 78%,#34405f 79%); border:4px solid #ffe680; box-shadow:0 5px 0 #aa8730,0 10px 28px rgba(255,219,105,.38); }
      .reward-reveal #reward-badge { animation:badge-reveal .9s ease both,badge-shine 2s 1s infinite; }
      #reward-summary { display:grid; gap:5px; margin:10px auto 14px; text-align:left; width:min(260px,100%); }
      .reward-item { opacity:0; color:#4f6971; font-weight:760; animation:reward-item .36s ease forwards; }
      @keyframes badge-reveal { from{opacity:0;transform:scale(.66) rotate(-8deg)}70%{opacity:1;transform:scale(1.08) rotate(3deg)}to{transform:scale(1)} }
      @keyframes badge-shine { 0%,55%{filter:brightness(1)}65%{filter:brightness(1.5)}78%,100%{filter:brightness(1)} }
      @keyframes reward-item { from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none} }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="sky-game"></canvas>
    <div id="objective-hud" aria-live="polite">구름이 가까운 하늘 능선 입구를 찾아가 보자</div>
    <div id="context-hint" aria-live="polite"></div>
    <div id="status">하늘 능선 준비 중…</div>
    <div id="dpad"><div class="dbtn" id="dpad-up">▲</div><div class="dbtn" id="dpad-left">◀</div><div class="dbtn" id="dpad-right">▶</div><div class="dbtn" id="dpad-down">▼</div></div>
    <div class="dbtn" id="dpad-a">A</div><div class="dbtn" id="dpad-b">B</div>
    <div id="modal"><div class="card"><div id="reward-badge" aria-label="하늘별 배지">⭐</div><img id="modal-img" alt="" /><div id="modal-progress"></div><h2 id="modal-title">하늘 능선</h2><p id="modal-body"></p><div id="modal-response" class="response"></div><div id="modal-choices"></div><div id="reward-summary"></div><button id="modal-confirm" type="button">계속</button><div id="modal-hint">A / Enter로 계속 · B / Escape로 닫기</div></div></div>
    <script type="module">
      import { startSkyRidgeGame } from "./src/sky_ridge_game.js";
      startSkyRidgeGame(document.querySelector("#sky-game"),document.querySelector("#modal"),document.querySelector("#status")).catch((error)=>{ console.error(error); document.querySelector("#status").textContent = `하늘 능선 시작 실패: ${error?.message || error}`; });
    </script>
  </body>
</html>
