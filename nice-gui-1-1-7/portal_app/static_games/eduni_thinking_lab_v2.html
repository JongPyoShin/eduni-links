이 자라는 데 필요한 물","intro":"같은 종류의 씨앗을 일주일 동안 키웠어요. 가상 관찰 기록에서 물의 양만 다른 두 실험을 찾아 비교해 보세요.","variable":"하루 물의 양","fields":["하루 물의 양","빛","흙"],"trials":[["물 5mL","밝은 곳","같은 흙",4],["물 15mL","밝은 곳","다른 흙",6],["물 5mL","그늘","같은 흙",2],["물 15mL","밝은 곳","같은 흙",7]],"unit":"일주일 뒤 평균 키(cm)","hint":"빛과 흙은 같고 물의 양만 다른 기록을 찾아보세요.","reflection":"이 기록에서는 물의 양이 다른 두 씨앗의 평균 키가 달랐어요. 모든 식물에 물을 많이 주는 것이 좋다는 뜻은 아니에요."}],"plan":[{"title":"소풍 간식 사기","intro":"친구들과 소풍을 가요. 동전 6개로 마실 것과 먹을 것을 각각 하나 이상 골라 주세요. 가방에는 무게가 4칸까지 들어가요.","budget":6,"cap":4,"requirements":{"drink":1,"food":1},"items":[["물","💧",2,1,"drink"],["주스","🧃",4,1,"drink"],["빵","🥖",3,1,"food"],["사과","🍎",2,1,"food"]]},{"title":"비 오는 날의 준비물","intro":"비가 오는 날 밖에 나갈 준비를 해요. 동전 8개로 비를 막는 물건과 발을 보호하는 물건을 골라 주세요. 가방에는 무게가 4칸까지 들어가요.","budget":8,"cap":4,"requirements":{"rain":1,"feet":1},"items":[["우산","☂️",4,2,"rain"],["우비","🧥",3,1,"rain"],["장화","🥾",5,3,"feet"],["방수 신발 덮개","🛍️",3,1,"feet"]]},{"title":"동물 병원에 물건 보내기","intro":"동물 병원에 물 두 병과 붕대 한 개 이상을 보내요. 동전은 10개, 상자는 무게 5칸까지 담을 수 있어요.","budget":10,"cap":5,"requirements":{"drink":2,"bandage":1},"items":[["물 한 병","💧",2,1,"drink"],["물 두 병 묶음","🧴",3,2,"drink2"],["작은 붕대","🩹",3,1,"bandage"],["큰 붕대","📦",5,3,"bandage"]]}]};
function foodResult(s,a){const valid=Array.isArray(a)&&a.length===s.need.length&&a.every(x=>Number.isInteger(x)&&x>=0);if(!valid)return {ok:false};const left=s.stock-a.reduce((x,y)=>x+y,0);const short=s.need.map((n,i)=>Math.max(0,n-a[i]));return {ok:left>=s.reserve&&short.every(x=>x===0),left,short};}
function runRoute(s,cmds){let p=s.start.slice(),path=[p.slice()];const d={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};if(cmds.length>s.limit)return {ok:false,path,reason:"limit"};for(let i=0;i<cmds.length;i++){let v=d[cmds[i]];if(!v)return {ok:false,path,reason:"command",at:i};let n=[p[0]+v[0],p[1]+v[1]];if(n[0]<0||n[1]<0||n[0]>=s.w||n[1]>=s.h||s.walls.some(w=>w[0]===n[0]&&w[1]===n[1]))return {ok:false,path,reason:"wall",at:i};p=n;path.push(p.slice());}return {ok:p[0]===s.goal[0]&&p[1]===s.goal[1],path,reason:"end"};}
function detectiveResult(s,idea,seen,proof){const ready=seen.length===s.clues.length&&idea!==null&&proof.length>=2;return {ready,ok:ready&&idea===s.correct&&s.proof.every(i=>proof.includes(i))&&proof.every(i=>seen.includes(i))};}
function bridgeResult(s,parts){if(parts.length!==s.loads.length||parts.some(p=>!Number.isInteger(p)||p< -1||p>=s.parts.length))return {ok:false};const cost=parts.reduce((a,p)=>a+(p<0?0:s.parts[p].cost),0);const weak=parts.map((p,i)=>p<0||s.parts[p].capacity<s.loads[i]?i:-1).filter(i=>i>=0);return {ok:cost<=s.budget&&!weak.length,cost,weak};}
function scienceResult(s,selected,prediction){if(selected.length!==2||new Set(selected).size!==2||selected.some(i=>!Number.isInteger(i)||i<0||i>=s.trials.length))return {ready:false,ok:false};const a=s.trials[selected[0]],b=s.trials[selected[1]],same=a[1]===b[1]&&a[2]===b[2],fair=same&&a[0]!==b[0];const outcome=a[3]===b[3]?2:a[3]>b[3]?0:1;return {ready:prediction!==null,ok:fair&&prediction!==null,fair,outcome,matched:prediction===outcome};}
function planResult(s,counts){if(counts.length!==s.items.length||counts.some(n=>!Number.isInteger(n)||n<0||n>20))return {ok:false};let cost=0,weight=0,have={};s.items.forEach((p,i)=>{cost+=p[2]*counts[i];weight+=p[3]*counts[i];let k=p[4]==="drink2"?"drink":p[4];have[k]=(have[k]||0)+counts[i]*(p[4]==="drink2"?2:1)});const missing=Object.keys(s.requirements).filter(k=>(have[k]||0)<s.requirements[k]);return {ok:cost<=s.budget&&weight<=s.cap&&!missing.length,cost,weight,missing};}

function node(tag,value,cls){const el=document.createElement(tag);if(value!==undefined)el.textContent=value;if(cls)el.className=cls;return el;}
function button(parent,label,fn,opts={}){const b=node("button",label,opts.primary?"primary":"");b.type="button";if(opts.pressed!==undefined)b.setAttribute("aria-pressed",String(opts.pressed));if(opts.label)b.setAttribute("aria-label",opts.label);b.disabled=!!opts.disabled;b.addEventListener("click",fn);parent.append(b);return b;}
function start(m,l){mode=m;level=l;state={a:[0,0,0],cmds:[],seen:[],proof:[],idea:null,result:null,attempted:false,parts:[],selected:[],prediction:null,counts:[0,0,0,0]};if(m==="bridge")state.parts=DATA[m][l].loads.map(()=>-1);render();}
function render(){menu.replaceChildren();for(const key of Object.keys(labels))button(menu,labels[key],()=>start(key,0),{pressed:key===mode});game.replaceChildren();const s=DATA[mode][level];game.append(node("div","탐험 "+(level+1)+" / "+DATA[mode].length,"tag"),node("h2",s.title),node("p",s.intro));const levels=node("div",undefined,"controls level");for(let i=0;i<DATA[mode].length;i++)button(levels,(i+1)+"단계",()=>start(mode,i),{pressed:i===level});game.append(levels);if(mode==="food")food(s);if(mode==="route")route(s);if(mode==="detect")detect(s);if(mode==="bridge")bridge(s);if(mode==="science")science(s);if(mode==="plan")plan(s);}
function status(t){const e=node("div",t,"status");e.setAttribute("role","status");game.append(e);}
function guide(t){const e=node("details");e.append(node("summary","부모님과 이야기해요"),node("p",t));game.append(e);}
function complete(){const box=node("div",undefined,"controls");if(level+1<DATA[mode].length)button(box,"다음 탐험",()=>start(mode,level+1),{primary:true});button(box,"다시 해보기",()=>start(mode,level));game.append(box);}
function food(s){const r=foodResult(s,state.a);game.append(node("h3","🧺 바구니에 남은 사과: "+r.left+"개"),node("p",s.reserve?"친구들에게 나눠 주고 "+s.reserve+"개 이상 남기는 것이 목표예요.":"모든 친구에게 필요한 만큼 나눠 주는 것이 목표예요.","small"));s.names.forEach((name,i)=>{const row=node("div",undefined,"animal"),info=node("div");info.append(node("strong",s.emoji[i]+" "+name),node("div","필요한 사과 "+s.need[i]+"개 · 받은 사과 "+state.a[i]+"개","small"),node("div","🍎".repeat(state.a[i])||"아직 받은 사과가 없어요.","apples"));const buttons=node("div",undefined,"controls");button(buttons,"−",()=>{state.a[i]--;state.attempted=false;render()},{disabled:state.a[i]===0,label:name+"에게서 사과 한 개 되돌리기"});button(buttons,"+",()=>{state.a[i]++;state.attempted=false;render()},{disabled:r.left===0,label:name+"에게 사과 한 개 주기"});row.append(info,buttons);game.append(row);});button(game,"나눈 결과 확인하기",()=>{state.attempted=true;render()},{primary:true});if(state.attempted){const shortage=s.names.filter((n,i)=>r.short[i]>0).map(n=>n);status(r.ok?(s.reserve?"모든 친구가 필요한 만큼 받았고, 늦게 오는 친구 몫도 남겼어요!":"모든 친구가 필요한 만큼 받았어요. 잘 나눠 주었네요!"):shortage.length?"아직 사과가 부족한 친구가 있어요: "+shortage.join(", ")+". 다른 친구의 사과를 옮기거나 남은 사과를 써 보세요.":"친구들은 충분히 받았지만 늦게 오는 친구 몫이 부족해요. 바구니에 조금 돌려놓아 보세요.");if(r.ok)complete();}else status("친구마다 필요한 수를 살펴보고 사과를 옮겨 보세요.");guide("똑같이 나누는 것과 필요한 만큼 나누는 것은 언제 다를까요? 아이가 먼저 이유를 설명하게 해 주세요.")}
function route(s){const grid=node("div",undefined,"grid");grid.style.gridTemplateColumns="repeat("+s.w+",1fr)";grid.setAttribute("role","img");grid.setAttribute("aria-label","로봇 지도. 로봇은 출발점, 꽃은 도착점, 돌은 지나갈 수 없는 칸입니다.");const same=(a,x,y)=>a[0]===x&&a[1]===y;for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const wall=s.walls.some(a=>same(a,x,y)),trail=state.result?.path.some(a=>same(a,x,y)),last=state.result?.path.at(-1)||s.start;const e=node("div",wall?"🪨":same(last,x,y)?"🤖":same(s.goal,x,y)?"🌼":trail?"•":"","cell"+(wall?" wall":trail?" trail":""));grid.append(e)}game.append(grid,node("p","로봇은 화살표 한 개마다 한 칸 움직여요. 돌이나 지도 밖으로 갈 수 없어요."),node("h3","이동 명령: "+state.cmds.length+" / "+s.limit+"개"),node("div",state.cmds.map(d=>dirs[d]).join(" ")||"화살표를 눌러 길을 만들어 보세요.","seq"));const c=node("div",undefined,"controls");for(const d of ["U","L","D","R"])button(c,dirs[d],()=>{state.cmds.push(d);state.result=null;render()},{disabled:state.cmds.length>=s.limit,label:dirNames[d]+"으로 한 칸 추가"});button(c,"마지막 지우기",()=>{state.cmds.pop();state.result=null;render()},{disabled:!state.cmds.length});button(c,"모두 지우기",()=>{state.cmds=[];state.result=null;render()},{disabled:!state.cmds.length});game.append(c);button(game,"로봇 출발!",()=>{state.result=runRoute(s,state.cmds);render()},{primary:true,disabled:!state.cmds.length});if(state.result){let r=state.result;status(r.ok?"꽃밭에 도착했어요! 네가 만든 길을 따라 로봇이 움직였어요.":r.reason==="wall"?(r.at+1)+"번째 명령에서 길이 막혔어요. 그 앞의 위치를 보고 명령을 고쳐 보세요.":"로봇이 아직 꽃밭에 도착하지 못했어요. 이동할 수 있는 횟수를 살펴보고 길을 다시 만들어 보세요.");if(r.ok)complete()}else status("출발하기 전에 로봇이 어디로 움직일지 예상해 보세요.");guide("어느 명령에서 로봇이 멈췄나요? 바로 답을 알려주기보다 그 칸에서 가능한 방향을 함께 살펴보세요.")}
function detect(s){game.append(node("h3","1. 단서 조사하기"));s.clues.forEach((c,i)=>{const box=node("div",undefined,"clue"),seen=state.seen.includes(i);button(box,seen?"✓ "+c[0]:c[0]+" 살펴보기",()=>{if(!seen)state.seen.push(i);state.attempted=false;render()},{pressed:seen});if(seen)box.append(node("p",c[1]));game.append(box)});game.append(node("h3","2. 단서를 보고 가장 알맞은 설명 고르기"));s.ideas.forEach((t,i)=>button(game,t,()=>{state.idea=i;state.attempted=false;render()},{pressed:state.idea===i} ).classList.add("choice"));game.append(node("h3","3. 그 설명을 뒷받침하는 단서 두 개 고르기"));state.seen.slice().sort((a,b)=>a-b).forEach(i=>{const l=node("label"),cb=node("input");cb.type="checkbox";cb.checked=state.proof.includes(i);cb.disabled=!cb.checked&&state.proof.length>=2;cb.addEventListener("change",()=>{state.proof=cb.checked?[...state.proof,i]:state.proof.filter(x=>x!==i);state.attempted=false;render()});l.append(cb,document.createTextNode(s.clues[i][0]+" — "+s.clues[i][1]));game.append(l)});const r=detectiveResult(s,state.idea,state.seen,state.proof);button(game,"내 생각 확인하기",()=>{state.attempted=true;render()},{primary:true,disabled:!r.ready});if(state.attempted){status(r.ok?s.why:"아직 설명과 단서가 충분히 연결되지 않았어요. "+s.hint);if(r.ok)complete()}else status("단서 네 개를 모두 보고, 설명 하나와 근거 두 개를 골라 보세요.");guide("확인한 사실과 아직 모르는 일을 구분해 보세요. 아이에게 어떤 단서를 보고 그렇게 생각했는지 물어보세요.")}

function bridge(s){
 const r=bridgeResult(s,state.parts);
 game.append(node("p","이 다리는 실제 구조물을 계산하는 도구가 아니라, 정해진 규칙으로 설계하는 모형 놀이예요.","small"),node("h3","남은 재료: "+(s.budget-r.cost)+"개"));
 const legend=node("div",undefined,"controls");s.parts.forEach(p=>legend.append(node("div",p.icon+" "+p.name+" · 재료 "+p.cost+"개 · 무게 "+p.capacity+"까지","clue")));game.append(legend);
 const river=node("div",undefined,"bridge-river");s.loads.forEach((load,i)=>{const cell=node("div",undefined,"bridge-cell");cell.append(node("strong",(i+1)+"번 칸"),node("div","무게 "+load,"small"),node("div",state.parts[i]<0?"🌊":s.parts[state.parts[i]].icon,"piece"));river.append(cell)});game.append(river);
 s.loads.forEach((load,i)=>{const row=node("div",undefined,"clue");row.append(node("h3",(i+1)+"번 칸에 놓을 재료"));const choices=node("div",undefined,"controls");s.parts.forEach((p,j)=>button(choices,p.icon+" "+p.name,()=>{state.parts[i]=j;state.attempted=false;render()},{pressed:state.parts[i]===j}));button(choices,"비우기",()=>{state.parts[i]=-1;state.attempted=false;render()},{disabled:state.parts[i]<0});row.append(choices);game.append(row)});
 button(game,"다리 시험하기",()=>{state.attempted=true;render()},{primary:true});
 if(state.attempted){status(r.ok?"다리의 모든 칸이 필요한 무게를 버텼어요. 재료도 정해진 수 안에서 사용했어요!":r.weak.length?"아직 "+r.weak.map(i=>(i+1)+"번").join(", ")+" 칸이 비어 있거나 필요한 무게를 버티지 못해요. 그 칸의 재료를 바꿔 보세요.":"다리는 무게를 버티지만 재료를 너무 많이 썼어요. 가벼운 무게를 버티는 칸부터 살펴보세요.");if(r.ok)complete()}else status("칸마다 버텨야 하는 무게를 확인한 뒤 재료를 골라 보세요.");
 guide("가장 튼튼한 재료만 쓰는 것과 필요한 곳에 알맞은 재료를 쓰는 것의 차이를 이야기해 보세요. 이 활동은 실제 다리의 안전성을 예측하지 않습니다.");
}
function science(s){
 game.append(node("h3","1. "+s.variable+"만 다른 두 기록 고르기"));
 s.trials.forEach((t,i)=>{const box=node("div",undefined,"clue");button(box,"실험 "+(i+1),()=>{state.selected=state.selected.includes(i)?state.selected.filter(x=>x!==i):[...state.selected,i];state.prediction=null;state.attempted=false;render()},{pressed:state.selected.includes(i),disabled:!state.selected.includes(i)&&state.selected.length>=2});s.fields.forEach((f,j)=>box.append(node("div",f+": "+t[j])));game.append(box)});
 if(state.selected.length===2){const a=state.selected[0],b=state.selected[1];game.append(node("h3","2. 결과를 예상해 보기"),node("p","어느 실험의 '"+s.unit+"' 값이 더 클까요?"));const c=node("div",undefined,"controls");["실험 "+(a+1),"실험 "+(b+1),"두 실험이 같을 것 같아요"].forEach((t,i)=>button(c,t,()=>{state.prediction=i;state.attempted=false;render()},{pressed:state.prediction===i}));game.append(c);}
 const r=scienceResult(s,state.selected,state.prediction);button(game,"관찰 기록 열기",()=>{state.attempted=true;render()},{primary:true,disabled:!r.ready});
 if(state.attempted){if(!r.fair){status("두 실험에서 다른 조건이 더 있어요. "+s.hint)}else{const a=state.selected[0],b=state.selected[1];const result=node("div",undefined,"clue");result.append(node("h3",s.unit));[a,b].forEach(i=>{result.append(node("div","실험 "+(i+1)+": "+s.trials[i][3]));const bar=node("div",undefined,"result-bar");bar.style.width=(100*s.trials[i][3]/Math.max(s.trials[a][3],s.trials[b][3]))+"%";result.append(bar)});game.append(result);status((r.matched?"예상한 결과와 같아요. ":"예상과 달랐네요. 새로운 사실을 발견했어요! ")+s.reflection);complete()}}else status("비교하려는 조건은 다르게, 나머지 조건은 같게 골라 보세요.");
 guide("관찰 기록은 학습을 위해 만든 가상 자료입니다. 아이가 결과를 예상한 이유를 말하게 하고, 예상과 다르더라도 기록을 근거로 생각을 바꾸는 과정을 칭찬해 주세요.");
}
function plan(s){
 const r=planResult(s,state.counts);const names={drink:"마실 것",food:"먹을 것",rain:"비를 막는 물건",feet:"발을 보호하는 물건",bandage:"붕대"};if(level===2)names.drink="물";
 game.append(node("h3","🪙 남은 동전: "+(s.budget-r.cost)+"개"),node("h3","🎒 남은 무게 칸: "+(s.cap-r.weight)+"칸"),node("p","필요한 물건: "+Object.entries(s.requirements).map(([k,n])=>names[k]+" "+n+(k==="drink"&&level===2?"병":"개")+" 이상").join(", "),"small"));
 s.items.forEach((p,i)=>{const row=node("div",undefined,"animal"),info=node("div");info.append(node("strong",p[1]+" "+p[0]),node("div","동전 "+p[2]+"개 · 무게 "+p[3]+"칸","small"),node("div","고른 수: "+state.counts[i]+"개"));const c=node("div",undefined,"controls");button(c,"−",()=>{state.counts[i]--;state.attempted=false;render()},{disabled:state.counts[i]===0,label:p[0]+" 하나 빼기"});button(c,"+",()=>{state.counts[i]++;state.attempted=false;render()},{disabled:state.counts[i]>=s.budget,label:p[0]+" 하나 담기"});row.append(info,c);game.append(row)});
 button(game,"준비가 끝났는지 확인하기",()=>{state.attempted=true;render()},{primary:true});
 if(state.attempted){const notes=[];if(r.cost>s.budget)notes.push("동전이 "+(r.cost-s.budget)+"개 부족해요.");if(r.weight>s.cap)notes.push("가방에 "+(r.weight-s.cap)+"칸만큼 무게가 넘쳐요.");if(r.missing.length)notes.push("아직 필요한 물건이 부족해요: "+r.missing.map(k=>names[k]).join(", ")+".");status(r.ok?"필요한 물건을 모두 골랐고, 동전과 무게 조건도 지켰어요. 다른 방법으로도 준비할 수 있을까요?":notes.join(" ")+" 물건을 바꿔 다시 계획해 보세요.");if(r.ok)complete()}else status("필요한 물건을 먼저 살펴보고 동전과 가방의 남은 공간을 확인해 보세요.");
 guide("같은 목표를 이루는 여러 조합을 찾아보세요. 더 싼 방법, 더 가벼운 방법 중 어떤 것이 상황에 어울리는지 이야기해 보세요.");
}
