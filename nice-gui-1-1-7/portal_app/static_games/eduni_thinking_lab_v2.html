 const r=s.rounds[round];if(!r||!Array.isArray(allocation)||allocation.length!==r.capacity.length||allocation.some(n=>!Number.isInteger(n)||n<0||n>r.helpers))return {valid:false,ok:false};
 const used=allocation.reduce((a,b)=>a+b,0),capacity=r.capacity.map((n,i)=>n+allocation[i]);let incoming=r.supply;
 const flow=capacity.map(cap=>{const done=Math.min(incoming,cap),waiting=incoming-done;incoming=done;return {done,waiting};});
 return {valid:used<=r.helpers,ok:used<=r.helpers&&incoming>=r.target,used,capacity,flow,output:incoming};
}
function inventResult(s,parts){
 if(!Array.isArray(parts)||new Set(parts).size!==parts.length||parts.some(i=>!Number.isInteger(i)||i<0||i>=s.parts.length))return {valid:false,ok:false};
 const cost=parts.reduce((a,i)=>a+s.parts[i][2],0),covered=new Set(parts.flatMap(i=>s.parts[i][3])),missing=s.needs.filter((_,i)=>!covered.has(i));
 return {valid:true,ok:cost<=s.budget&&!missing.length,cost,missing};
}
function differentDesign(s,a,b){
 if(!inventResult(s,a).ok||!inventResult(s,b).ok)return false;
 // A useful design must change functional components, not just decorations.
 const functional=x=>x.filter(i=>s.parts[i][3].length);
 const fa=functional(a),fb=functional(b);
 return fa.some(i=>!fb.includes(i))&&fb.some(i=>!fa.includes(i));
}
function storyResult(s,seen,tried,choice,priority,reason,spoken=false){
 const validList=(a,n)=>Array.isArray(a)&&new Set(a).size===a.length&&a.every(i=>Number.isInteger(i)&&i>=0&&i<n);
 const ready=validList(seen,s.people.length)&&seen.length===s.people.length&&validList(tried,s.actions.length)&&tried.length>=2&&tried.includes(choice)&&Number.isInteger(priority)&&priority>=0&&priority<s.priorities.length&&typeof reason==="string"&&reason.length<=500&&(reason.trim().length>0||spoken===true);
 return {ready,ok:ready}; // No moral correctness score.
}

 game.append(node("h3","처음 들어오는 "+s.unit+": "+r.supply+(s.unit==="책"?"권":"개")),node("h3","배치할 수 있는 도우미: "+(r.helpers-out.used)+"명"));
 s.stages.forEach((name,i)=>{
  const stage=node("div",undefined,"flow-stage");stage.append(node("h3",s.icons[i]+" "+(i+1)+". "+name),node("p","기본 처리량 "+r.capacity[i]+" · 도우미 "+state.allocation[i]+"명 · 처리할 수 있는 양 "+out.capacity[i]));
  const c=node("div",undefined,"controls");button(c,"−",()=>{state.allocation[i]--;state.attempted=false;render()},{disabled:state.allocation[i]===0,label:name+" 도우미 한 명 빼기"});button(c,"+",()=>{state.allocation[i]++;state.attempted=false;render()},{disabled:out.used>=r.helpers,label:name+" 도우미 한 명 추가"});stage.append(c);
  if(state.attempted)stage.append(node("div","마친 양: "+out.flow[i].done+" · 이곳에서 기다리는 양: "+out.flow[i].waiting,"status"));
  game.append(stage);if(i<s.stages.length-1)game.append(node("div","↓","flow-arrow"));
 });
 button(game,"일을 시작해 보기",()=>{state.attempted=true;render()},{primary:true});
 if(state.attempted){
  const waiting=out.flow.map((f,i)=>f.waiting?s.stages[i]+"("+f.waiting+")":null).filter(Boolean);
  status("모든 작업을 마친 "+s.unit+": "+out.output+(s.unit==="책"?"권":"개")+". "+(out.ok?"목표를 이루었어요!":(waiting.length?"아직 일이 밀려 있는 곳: "+waiting.join(", ")+". ":"")+"도우미를 다른 곳으로 옮겨 다시 시험해 보세요."));
  if(out.ok&&state.round===0)button(game,"상황이 바뀌었어요! 다음 도전",()=>{state.baseline={allocation:state.allocation.slice(),output:out.output};state.round=1;state.attempted=false;render()},{primary:true});
  if(out.ok&&state.round===1){const compare=node("div",undefined,"compare-grid");compare.append(node("div","처음 상황: "+state.baseline.output+" · 도우미 "+state.baseline.allocation.join(" / ")),node("div","바뀐 상황: "+out.output+" · 도우미 "+state.allocation.join(" / ")));game.append(compare,node("p",s.question));complete();}
 }else status(state.round===1?"처음 배치한 도우미가 그대로 있어요. 바뀐 처리량을 보고 옮겨도 좋아요.":"어느 곳에서 물건이 기다릴지 예상하고 도우미를 배치해 보세요.");
 guide("각 작업의 처리량과 실제로 마친 양은 다를 수 있어요. 앞 작업에서 물건이 충분히 오지 않으면 뒤 작업에 여유가 생겨요. 이 모형은 한 번의 작업 흐름을 단순화한 것이며 실제 공장의 시간과 재고를 예측하지 않습니다.");
}
function invent(s){
 const out=inventResult(s,state.design);
 game.append(node("p","이 발명 놀이는 부품마다 정해진 기능과 비용으로 작동해요. 실제 물건의 안전성이나 성능을 보장하는 것은 아니에요.","small"),node("h3",state.firstDesign?"두 번째 작품 만들기":"첫 번째 작품 만들기"),node("p","필요한 기능: "+s.needs.join(" · ")),node("h3",out.cost>s.budget?"부족한 재료: "+(out.cost-s.budget)+"개":"남은 재료: "+(s.budget-out.cost)+"개"));
 s.parts.forEach((part,i)=>{const box=node("div",undefined,"clue");button(box,part[1]+" "+part[0],()=>{state.design=state.design.includes(i)?state.design.filter(k=>k!==i):[...state.design,i];state.attempted=false;render()},{pressed:state.design.includes(i)});box.append(node("div","재료 "+part[2]+"개 · "+(part[3].length?part[3].map(k=>s.needs[k]).join(", "):"꾸미기")));game.append(box)});
 const preview=node("div",undefined,"workshop-note");preview.append(node("h3","내가 고른 부품"),node("p",state.design.length?state.design.map(i=>s.parts[i][1]+" "+s.parts[i][0]).join(" + "):"아직 고른 부품이 없어요."));game.append(preview);
 button(game,"내 작품 시험하기",()=>{state.attempted=true;render()},{primary:true});
 if(state.attempted){
  if(!out.ok){let messages=[];if(out.missing.length)messages.push("아직 부족한 기능: "+out.missing.join(", ")+".");if(out.cost>s.budget)messages.push("재료가 "+(out.cost-s.budget)+"개 부족해요.");status(messages.join(" ")+" 부품을 바꾸어 다시 만들어 보세요.");}
  else if(!state.firstDesign){status("필요한 기능을 모두 갖췄어요! 이번에는 다른 부품으로도 만들어 볼까요?");button(game,"다른 작품 만들기",()=>{state.firstDesign=state.design.slice();state.attempted=false;render()},{primary:true});}
  else if(!differentDesign(s,state.firstDesign,state.design)){status("기능을 만드는 부품을 다른 부품으로 바꾸어 보세요. 꾸미기만 바꾸거나 부품을 더 붙이는 것과는 달라요.");}
  else{const first=inventResult(s,state.firstDesign);const compare=node("div",undefined,"compare-grid");compare.append(node("div","첫 번째 작품 · 재료 "+first.cost+"개: "+state.firstDesign.map(i=>s.parts[i][0]).join(", ")),node("div","두 번째 작품 · 재료 "+out.cost+"개: "+state.design.map(i=>s.parts[i][0]).join(", ")));game.append(compare);status("다른 방법으로 두 작품을 만들었어요! "+s.question);complete();}
 }else status(state.firstDesign?"처음 작품을 바탕으로 부품을 바꾸어 보세요.":"어떤 부품이 필요한 기능을 만들어 줄지 생각해 보세요.");
 guide("완성된 두 작품 중 어느 것이 더 좋은지는 상황에 따라 달라질 수 있어요. 아이가 새로운 부품을 상상하거나 종이에 그림을 그려 설명하도록 격려해 주세요. 꾸미기만 바꾸는 것이 아니라 기능을 담당하는 부품을 다른 것으로 바꾸어 보도록 안내해 주세요.");
}
function story(s){
 game.append(node("h3","1. 두 친구의 마음 들어 보기"));
 s.people.forEach((person,i)=>{const box=node("div",undefined,"clue");button(box,person[1]+" "+person[0]+"의 이야기 듣기",()=>{if(!state.seen.includes(i))state.seen.push(i);render()},{pressed:state.seen.includes(i)});if(state.seen.includes(i))box.append(node("p",person[2]));game.append(box)});
 if(state.seen.length!==s.people.length){status("두 친구의 이야기를 모두 들어 보세요.");return;}
 game.append(node("h3","2. 다른 방법을 비교해 보기"),node("p","방법마다 어떤 일이 생길지 살펴보세요. 두 가지 이상을 비교한 뒤 마음에 드는 방법을 정해 보세요."));
 s.actions.forEach((a,i)=>{const box=node("div",undefined,"clue");button(box,a[0],()=>{if(!state.tried.includes(i))state.tried.push(i);render()},{pressed:state.tried.includes(i)});if(state.tried.includes(i))box.append(node("p",a[1]));game.append(box)});
 if(state.tried.length<2){status("다른 방법도 하나 더 살펴보세요.");return;}
 game.append(node("h3","3. 내가 중요하게 생각하는 것"),node("p","무엇을 가장 중요하게 생각하나요?"));
 s.priorities.forEach((p,i)=>button(game,p,()=>{state.priority=i;state.spoken=false;state.attempted=false;render()},{pressed:state.priority===i}).classList.add("choice"));
 game.append(node("h3","4. 내 방법 정하기"));
 state.tried.slice().sort((a,b)=>a-b).forEach(i=>button(game,s.actions[i][0],()=>{state.choice=i;state.spoken=false;state.attempted=false;render()},{pressed:state.choice===i}).classList.add("choice"));
 game.append(node("p","왜 이 방법을 골랐나요? 가족에게 말로 설명하거나 아래에 적어 보세요. 또 다른 방법이 떠오르면 함께 이야기해도 좋아요."));
 const note=node("textarea");note.value=state.reason;note.maxLength=500;note.setAttribute("aria-label","내가 고른 방법의 이유");note.placeholder="내 생각을 적어도 좋아요. (선택)";
 const reasonBox=node("div",undefined,"workshop-note");reasonBox.append(note);game.append(reasonBox);
 button(reasonBox,state.spoken?"✓ 말로 설명했어요":"가족에게 말로 설명했어요",()=>{state.spoken=!state.spoken;state.attempted=false;render()},{pressed:state.spoken});
 const finish=button(reasonBox,"내 생각 정리하기",()=>{state.attempted=true;render()},{primary:true,disabled:!storyResult(s,state.seen,state.tried,state.choice,state.priority,state.reason,state.spoken).ready});
 note.addEventListener("input",()=>{state.reason=note.value.slice(0,500);finish.disabled=!storyResult(s,state.seen,state.tried,state.choice,state.priority,state.reason,state.spoken).ready;});
 if(state.attempted&&storyResult(s,state.seen,state.tried,state.choice,state.priority,state.reason,state.spoken).ok){status("두 친구의 마음을 듣고 여러 방법을 비교했어요. 네가 중요하게 생각한 이유도 정리했네요. "+s.question);note.disabled=true;complete();}
 else status("정해진 정답은 없어요. 다른 친구의 마음도 생각하며 네 의견을 정리해 보세요.");
 guide("아이의 선택을 정답이나 오답으로 평가하지 마세요. 그 방법이 누구에게 도움이 되고 어떤 어려움이 남는지 질문해 주세요. 아이가 글을 쓰기 어렵다면 말로 설명한 뒤 확인 버튼을 눌러도 됩니다. 입력 내용은 저장하거나 전송하지 않습니다.");
}

start("food",0);
</script></body></html>
