          <div class="title-row"><span class="logo-bug"></span><h1>EDUNI Link</h1></div>

      </div>
      <button id="soundBtn" class="icon-btn" aria-label="소리">🔊</button>
    </header>

    <section class="hud">
      <div><span>스테이지</span><strong id="stageNo">1</strong></div>
      <div class="timer-box"><span>남은 시간</span><strong id="timer">3:00</strong></div>
      <div><span>점수</span><strong id="score">0</strong></div>
      <div><span>남은 쌍</span><strong id="pairsLeft">24</strong></div>
    </section>

    <section class="mission">
      <div class="mission-head">
        <strong>오늘의 미션</strong>
        <span id="missionBadge">스테이지 1 · 0/3 ⭐</span>
      </div>
      <div class="bar"><div id="missionFill"></div></div>
      <ul id="missionList" class="mission-list"></ul>
    </section>

    <main class="game-panel">
      <div class="cave-glow"></div>
      <canvas id="lineCanvas"></canvas>
      <section id="board" class="board" aria-label="링크 퍼즐 보드"></section>
    </main>

    <section class="sub-hud">
      <div><span>콤보</span><strong id="combo">0</strong></div>
      <div><span>의준 블럭</span><strong id="uijunFound">0/6</strong></div>
      <div><span>도감</span><strong id="codexSummary">0/16</strong></div>
    </section>

    <section class="controls">
      <button id="hintBtn">💡 힌트</button>
      <button id="shuffleBtn">🔀 섞기</button>
      <button id="codexBtn">📒 도감</button>
      <button id="parentBtn">👨‍👩‍👧 부모</button>
      <button id="newBtn" class="primary">새 게임</button>
    </section>

    <section class="mini-codex">
      <div class="mini-head">
        <strong>의준 블럭 도감</strong>
        <span>새 표정을 찾으면 계속 저장돼요</span>
      </div>
      <div id="miniCodexList" class="mini-list"></div>
    </section>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="modalCloseX" class="modal-x">×</button>
      <div id="modalIcon" class="modal-icon">🎉</div>
      <h2 id="modalTitle">스테이지 클리어!</h2>
      <p id="modalMessage">미션을 완료했어요.</p>
      <div id="codexGrid" class="codex-grid"></div>
      <div id="modalActions"></div>
      <button id="modalClose" class="secondary big">닫기</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
