<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Jungle Camp — Storybook Adventure</title>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/loaders/DRACOLoader.js": "./src/local_draco_loader.js",
          "three/addons-local/": "./node_modules/three/examples/jsm/",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #1a2a1f; overflow: hidden; font-family: system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #dpad { position: fixed; left: 18px; bottom: 18px; width: 168px; height: 168px; z-index: 5; }
      .dbtn {
        position: absolute; width: 52px; height: 52px; border-radius: 12px;
        background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.4);
        color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
        user-select: none; touch-action: none;
      }
      #dpad-up { left: 58px; top: 0; }
      #dpad-left { left: 0; top: 58px; }
      #dpad-right { left: 116px; top: 58px; }
      #dpad-down { left: 58px; top: 116px; }
      #dpad-a { position: fixed; right: 18px; bottom: 84px; width: 64px; height: 64px; border-radius: 50%; background: rgba(34,197,94,0.5); border: 2px solid rgba(34,197,94,0.9); z-index: 5; }
      #dpad-b { position: fixed; right: 92px; bottom: 18px; width: 64px; height: 64px; border-radius: 50%; background: rgba(239,68,68,0.5); border: 2px solid rgba(239,68,68,0.9); z-index: 5; }
      .dbtn:active { background: rgba(255,255,255,0.4); }
      #objective-hud { position: fixed; top: 14px; left: 14px; max-width: min(310px, calc(100vw - 28px)); color: #f8ffdf; font-size: clamp(13px, 2.1vw, 17px); font-weight: 800; background: rgba(15, 41, 27, 0.82); border: 1px solid rgba(215, 240, 180, 0.55); padding: 9px 13px; border-radius: 13px; box-shadow: 0 5px 18px rgba(0,0,0,0.24); z-index: 4; transition: opacity .32s ease, transform .32s ease; }
      #context-hint { position: fixed; top: 52px; left: 14px; max-width: min(260px, calc(100vw - 28px)); color: #a8e6c3; font-size: clamp(11px, 1.8vw, 14px); font-weight: 600; background: rgba(15, 41, 27, 0.65); border: 1px solid rgba(180, 220, 160, 0.35); padding: 5px 10px; border-radius: 10px; z-index: 4; opacity: 0; transform: translateY(-3px); transition: opacity .28s ease, transform .28s ease; }
      #context-hint.visible { opacity: 1; transform: translateY(0); }
      #objective-hud.objective-change { animation: objective-change .42s ease; }
      #objective-hud.softened { opacity: .28; transform: translateY(-4px); }
      @keyframes objective-change { 0% { transform: translateY(5px); opacity: .25; } 70% { transform: translateY(-1px); opacity: 1; } 100% { transform: translateY(0); } }
      #modal {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.55); z-index: 10;
      }
      #modal .card {
        background: #fffdf5; border-radius: 20px; padding: 21px; width: min(360px, calc(100vw - 36px)); max-height: calc(100vh - 36px); overflow-y: auto; text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      #modal .card img { width: 160px; height: 160px; object-fit: contain; margin-bottom: 10px; }
      #modal .card h2 { margin: 6px 0; color: #153c32; }
      #modal .card p { white-space: pre-line; color: #334155; font-size: 15px; line-height: 1.55; }
      #modal-progress { min-height: 18px; color: #256b53; font-size: 13px; font-weight: 800; }
      #modal-choices { display: grid; gap: 8px; margin: 14px 0; text-align: left; }
      .choice { border: 2px solid #dce9dd; border-radius: 11px; padding: 10px 12px; color: #315246; font-weight: 750; }
      .choice.focused { border-color: #f2a93b; box-shadow: 0 0 0 3px rgba(242,169,59,.18); }
      .choice.selected { background: #e9f8e6; border-color: #72b96b; }
      .response { min-height: 20px; margin: 5px 0; color: #5a6d55; font-weight: 750; font-size: 14px; }
      .response.gentle { color: #96682c; }
      .gentle-shake { animation: gentle-shake .34s ease; }
      @keyframes gentle-shake { 0%,100% { transform: translateX(0); } 35% { transform: translateX(-5px); } 70% { transform: translateX(5px); } }
      #modal-confirm { border: 0; border-radius: 12px; background: #2d8a5c; color: #fff; padding: 11px 17px; font-weight: 800; font-size: 15px; }
      #reward-badge { display: none; place-items: center; margin: 0 auto 12px; width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #fff 0 7%, #7dd3fc 8% 28%, #2563eb 29% 72%, #163a78 73%); border: 4px solid #f6d365; box-shadow: 0 4px 0 #b57b24, 0 8px 18px rgba(37,99,235,.32); color: #fff; font-size: 40px; text-shadow: 0 1px 2px #123; }
      .reward-reveal #reward-badge { animation: badge-reveal 1s .1s both, badge-shine 2s .9s infinite; }
      #reward-summary { display: grid; gap: 5px; margin: 10px auto 14px; text-align: left; width: min(230px, 100%); }
      .reward-item { opacity: 0; color: #27664a; font-weight: 750; animation: reward-item .36s ease forwards; }
      @keyframes badge-reveal { 0% { opacity: 0; transform: scale(.7); } 70% { opacity: 1; transform: scale(1.05); } 100% { transform: scale(1); } }
      @keyframes badge-shine { 0%,54% { filter: brightness(1); } 62% { filter: brightness(1.45); } 72%,100% { filter: brightness(1); } }
      @keyframes reward-item { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
      #modal .card .hint { margin-top: 12px; font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas></div>

    <div id="dpad">
      <div class="dbtn" id="dpad-up">▲</div>
      <div class="dbtn" id="dpad-left">◀</div>
      <div class="dbtn" id="dpad-right">▶</div>
      <div class="dbtn" id="dpad-down">▼</div>
    </div>
    <div class="dbtn" id="dpad-a">A</div>
    <div class="dbtn" id="dpad-b">B</div>
    <div id="objective-hud" aria-live="polite">학습 오두막을 찾아가 보자</div>
    <div id="context-hint" aria-live="polite"></div>

    <div id="modal">
      <div class="card">
        <div id="reward-badge" aria-label="파랑새 관찰 배지">🪶</div>
        <img id="modal-img" alt="bluebird" />
        <div id="modal-progress"></div>
        <h2 id="modal-title">오늘의 탐험</h2>
        <p id="modal-body"></p>
        <div id="modal-response" class="response"></div>
        <div id="modal-choices"></div>
        <div id="reward-summary"></div>
        <button id="modal-confirm" type="button">계속</button>
        <div id="modal-hint" class="hint">A / Enter로 계속 · B / Escape로 닫기</div>
      </div>
    </div>

    <script type="module">
      import { start } from "./src/game.js?v=camp-cardinal-0c28ad0";
      const canvas = document.getElementById("game");
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);
      const modalEl = document.getElementById("modal");
      const params = new URLSearchParams(window.location.search);
      const qaEnabled = params.get("qa") === "1";
      let qaStateEl = null;
      let qaThreeReady = false;

      function ensureQaStateEl() {
        if (!qaEnabled) return null;
        if (qaStateEl) return qaStateEl;
        qaStateEl = document.createElement("output");
        qaStateEl.id = "qa-runtime-state";
        qaStateEl.hidden = true;
        qaStateEl.dataset.contract = "eduni-jungle-qa-v1";
        qaStateEl.dataset.startup = "booting";
        document.body.appendChild(qaStateEl);
        return qaStateEl;
      }

      function writeQaSnapshot() {
        const el = ensureQaStateEl();
        if (!el) return;
        const bridge = globalThis.__eduniJungleGame;
        const startup = globalThis.__eduniJungleStartup;
        const player = bridge?.player || null;
        const snapshot = {
          startup: startup?.phase || (bridge ? "gameplay-ready" : "waiting"),
          startupDetail: startup ? {
            lastCompletedStep: startup.lastCompletedStep || null,
            error: startup.error || null,
            presentationError: startup.presentationError || null,
          } : null,
          stageId: bridge?.stageId || null,
          player: player ? { x: player.x, y: player.y } : null,
          phase: bridge?.getPhase?.() ?? null,
          target: bridge?.getTarget?.() ?? null,
          objective: bridge?.getObjective?.() ?? null,
          state: bridge?.getState?.() ?? null,
          threeReady: qaThreeReady || Boolean(document.querySelector("#three-camp-runtime")),
        };
        el.dataset.startup = snapshot.startup;
        el.dataset.stageId = snapshot.stageId || "";
        el.dataset.playerX = player ? String(player.x) : "";
        el.dataset.playerY = player ? String(player.y) : "";
        el.dataset.threeReady = snapshot.threeReady ? "true" : "false";
        el.textContent = JSON.stringify(snapshot);
      }

      function startQaDomMirror() {
        if (!qaEnabled) return;
        ensureQaStateEl();
        const tick = () => {
          writeQaSnapshot();
          window.setTimeout(tick, 100);
        };
        tick();
      }

      startQaDomMirror();
      await start(canvas, modalEl);
      const isCamp = params.get("stage") !== "waterfall";
      const wantsThreeCamp = isCamp && params.get("renderer") !== "canvas";
      if (wantsThreeCamp) {
        try {
          const { startThreeCampRuntime } = await import("./src/three_camp_runtime.js?v=camp-three-3");
          const { alignCampLandmarks } = await import("./src/three_camp_alignment.js?v=camp-three-3");
          const runtime = await startThreeCampRuntime(canvas, globalThis.__eduniJungleGame);
          alignCampLandmarks(runtime);
          qaThreeReady = true;
          writeQaSnapshot();
        } catch (error) {
          console.error("Three Camp startup failed; keeping Canvas fallback", error);
          canvas.style.visibility = "visible";
          writeQaSnapshot();
        }
      }
    </script>
  </body>
</html>
